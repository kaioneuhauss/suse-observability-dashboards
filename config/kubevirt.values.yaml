# Edit endpoint and cluster name; verify all four certificate names.
# Pass --set-file extraManifests[0].data.ca-bundle=PATH for the target CA.
clusterRole:
  create: true
  rules:
  - apiGroups:
    - ''
    resources:
    - pods
    - services
    verbs:
    - get
    - list
    - watch
  - apiGroups:
    - discovery.k8s.io
    resources:
    - endpointslices
    verbs:
    - get
    - list
    - watch
config:
  exporters:
    debug: null
    otlp_grpc/suse-observability:
      auth:
        authenticator: bearertokenauth
      compression: snappy
      endpoint: OTLP_ENDPOINT:443
  extensions:
    bearertokenauth:
      scheme: SUSEObservability
      token: ${env:API_KEY}
    health_check:
      endpoint: ${env:MY_POD_IP}:13133
  processors:
    batch:
      send_batch_size: 1000
      timeout: 10s
    memory_limiter:
      check_interval: 5s
      limit_percentage: 80
      spike_limit_percentage: 25
    resource:
      attributes:
      - action: upsert
        key: k8s.cluster.name
        value: HARVESTER_CLUSTER_NAME
  receivers:
    jaeger: null
    otlp: null
    prometheus:
      config:
        scrape_configs:
        - job_name: kubevirt-metrics-virt-api
          kubernetes_sd_configs:
          - namespaces:
              names:
              - harvester-system
            role: endpointslice
            selectors:
            - role: endpointslice
              label: kubernetes.io/service-name=kubevirt-prometheus-metrics
          relabel_configs:
          - action: keep
            regex: virt-api
            source_labels:
            - __meta_kubernetes_pod_label_kubevirt_io
          - action: keep
            regex: metrics
            source_labels:
            - __meta_kubernetes_endpointslice_port_name
          - source_labels:
            - __meta_kubernetes_pod_name
            target_label: k8s_pod_name
          - source_labels:
            - __meta_kubernetes_namespace
            target_label: k8s_namespace_name
          - source_labels:
            - __meta_kubernetes_endpointslice_endpoint_node_name
            target_label: k8s_node_name
          - target_label: job
            replacement: kubevirt-metrics
          scheme: https
          scrape_interval: 30s
          tls_config:
            ca_file: /kubevirt-ca/ca-bundle
            server_name: virt-api.harvester-system.svc
        - job_name: kubevirt-metrics-virt-controller
          kubernetes_sd_configs:
          - namespaces:
              names:
              - harvester-system
            role: endpointslice
            selectors:
            - role: endpointslice
              label: kubernetes.io/service-name=kubevirt-prometheus-metrics
          relabel_configs:
          - action: keep
            regex: virt-controller
            source_labels:
            - __meta_kubernetes_pod_label_kubevirt_io
          - action: keep
            regex: metrics
            source_labels:
            - __meta_kubernetes_endpointslice_port_name
          - source_labels:
            - __meta_kubernetes_pod_name
            target_label: k8s_pod_name
          - source_labels:
            - __meta_kubernetes_namespace
            target_label: k8s_namespace_name
          - source_labels:
            - __meta_kubernetes_endpointslice_endpoint_node_name
            target_label: k8s_node_name
          - target_label: job
            replacement: kubevirt-metrics
          scheme: https
          scrape_interval: 30s
          tls_config:
            ca_file: /kubevirt-ca/ca-bundle
            server_name: virt-controller.harvester-system.svc
        - job_name: kubevirt-metrics-virt-handler
          kubernetes_sd_configs:
          - namespaces:
              names:
              - harvester-system
            role: endpointslice
            selectors:
            - role: endpointslice
              label: kubernetes.io/service-name=kubevirt-prometheus-metrics
          relabel_configs:
          - action: keep
            regex: virt-handler
            source_labels:
            - __meta_kubernetes_pod_label_kubevirt_io
          - action: keep
            regex: metrics
            source_labels:
            - __meta_kubernetes_endpointslice_port_name
          - source_labels:
            - __meta_kubernetes_pod_name
            target_label: k8s_pod_name
          - source_labels:
            - __meta_kubernetes_namespace
            target_label: k8s_namespace_name
          - source_labels:
            - __meta_kubernetes_endpointslice_endpoint_node_name
            target_label: k8s_node_name
          - target_label: job
            replacement: kubevirt-metrics
          scheme: https
          scrape_interval: 30s
          tls_config:
            ca_file: /kubevirt-ca/ca-bundle
            server_name: virt-handler.harvester-system.svc
        - job_name: kubevirt-metrics-virt-operator
          kubernetes_sd_configs:
          - namespaces:
              names:
              - harvester-system
            role: endpointslice
            selectors:
            - role: endpointslice
              label: kubernetes.io/service-name=kubevirt-prometheus-metrics
          relabel_configs:
          - action: keep
            regex: virt-operator
            source_labels:
            - __meta_kubernetes_pod_label_kubevirt_io
          - action: keep
            regex: metrics
            source_labels:
            - __meta_kubernetes_endpointslice_port_name
          - source_labels:
            - __meta_kubernetes_pod_name
            target_label: k8s_pod_name
          - source_labels:
            - __meta_kubernetes_namespace
            target_label: k8s_namespace_name
          - source_labels:
            - __meta_kubernetes_endpointslice_endpoint_node_name
            target_label: k8s_node_name
          - target_label: job
            replacement: kubevirt-metrics
          scheme: https
          scrape_interval: 30s
          tls_config:
            ca_file: /kubevirt-ca/ca-bundle
            server_name: kubevirt-operator-webhook.harvester-system.svc
    zipkin: null
  service:
    extensions:
    - health_check
    - bearertokenauth
    pipelines:
      logs: null
      metrics:
        exporters:
        - otlp_grpc/suse-observability
        processors:
        - memory_limiter
        - resource
        - batch
        receivers:
        - prometheus
      traces: null
    telemetry:
      resource:
        k8s.namespace.name: null
        k8s.node.name: null
        k8s.node.ip: null
        k8s.pod.name: null
        k8s.pod.ip: null
        host.name: null
        attributes:
        - name: k8s.namespace.name
          value: ${env:OTEL_K8S_NAMESPACE}
        - name: k8s.node.name
          value: ${env:OTEL_K8S_NODE_NAME}
        - name: k8s.node.ip
          value: ${env:OTEL_K8S_NODE_IP}
        - name: k8s.pod.name
          value: ${env:OTEL_K8S_POD_NAME}
        - name: k8s.pod.ip
          value: ${env:OTEL_K8S_POD_IP}
        - name: host.name
          value: ${env:OTEL_K8S_NODE_NAME}
extraEnvsFrom:
- secretRef:
    name: open-telemetry-collector
imagePullSecrets:
- name: application-collection
mode: deployment
ports:
  jaeger-compact:
    enabled: false
  jaeger-grpc:
    enabled: false
  jaeger-thrift:
    enabled: false
  metrics:
    enabled: true
  otlp:
    enabled: false
  otlp-http:
    enabled: false
  zipkin:
    enabled: false
replicaCount: 1
extraVolumes:
- name: kubevirt-ca
  configMap:
    name: kubevirt-metrics-ca
extraVolumeMounts:
- name: kubevirt-ca
  mountPath: /kubevirt-ca
  readOnly: true
image:
  repository: dp.apps.rancher.io/containers/opentelemetry-collector
  tag: 0.156.0-k8s-13.1
resources:
  requests:
    cpu: 20m
    memory: 192Mi
  limits:
    cpu: 300m
    memory: 512Mi
podAnnotations:
  checksum/kubevirt-ca: '{{ required "CA_bundle_required" (index (index .Values.extraManifests 0).data "ca-bundle") | sha256sum
    }}'
extraManifests:
- apiVersion: v1
  kind: ConfigMap
  metadata:
    name: kubevirt-metrics-ca
  data:
    ca-bundle: ''
