# EDITE clusterName, URL e a referência do Secret antes de aplicar.
# PSI é opcional: habilite somente se /proc/pressure existir nos nós.
clusterName: cliente-harvester
remoteWrite:
  url: https://observability.cliente.example/receiver/prometheus/api/v1/write
  existingSecret: suse-observability-agent-secrets
  secretKey: STS_API_KEY
  username: apikey
nodeExporter:
  pressureEnabled: false
etcd:
  enabled: true
traefik:
  enabled: false
  namespace: kube-system
  selector:
    app.kubernetes.io/name: rke2-traefik
  allowMetricsNetworkPolicy: false
