# This environment already isolates kube-system. Allow only the telemetry pods to scrape TCP/9100.
clusterName: rancher-example
remoteWrite:
  url: https://observability.example.com/receiver/prometheus/api/v1/write
  existingSecret: suse-observability-agent-secrets
  secretKey: STS_API_KEY
etcd:
  enabled: true
traefik:
  enabled: true
  allowMetricsNetworkPolicy: true
  existingIsolationConfirmed: true
nodeExporter:
  pressureEnabled: false
safety:
  profile: conservative
  cardinality:
    mode: observe
