{{- if and (eq .Values.lifecycle.action "delete") (ne .Values.lifecycle.confirmDelete "DELETE_MANAGED_OBJECTS") -}}
{{- fail "Delete exige lifecycle.confirmDelete=DELETE_MANAGED_OBJECTS; limita-se aos objetos deste chart" -}}
{{- end -}}
{{- range $kind := list "dashboards" "monitors" }}
{{- if (index $.Values $kind).enabled }}
{{- with $ }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-{{ $kind }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/name: {{ .Chart.Name }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: {{ if eq $kind "dashboards" }}"10"{{ else }}"20"{{ end }}
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 0
  activeDeadlineSeconds: {{ .Values.publisher.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: {{ .Values.publisher.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        publication/revision: {{ .Values.lifecycle.revision | quote }}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      nodeSelector:
{{ toYaml .Values.publisher.nodeSelector | indent 8 }}
      tolerations:
{{ toYaml .Values.publisher.tolerations | indent 8 }}
      imagePullSecrets:
{{ toYaml .Values.publisher.imagePullSecrets | indent 8 }}
      containers:
        - name: publisher
          image: {{ .Values.publisher.image | quote }}
          imagePullPolicy: {{ .Values.publisher.imagePullPolicy }}
          command: [python3, -B, /definitions/publisher.py]
          env:
            - {name: STS_CLI_URL, value: {{ trimSuffix "/" .Values.observability.url | quote }}}
            - name: STS_CLI_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ (index .Values.auth $kind).existingSecret }}
                  key: {{ (index .Values.auth $kind).serviceTokenKey }}
            - {name: PUBLISH_KIND, value: {{ if eq $kind "dashboards" }}dashboard-bundle{{ else }}monitor{{ end }}}
            - {name: PUBLISH_ACTION, value: {{ .Values.lifecycle.action | quote }}}
            - {name: CONFIRM_DELETE, value: {{ .Values.lifecycle.confirmDelete | quote }}}
            - {name: CLI_PATH, value: {{ .Values.publisher.cli.path | quote }}}
            - {name: CLI_DOWNLOAD_URL, value: {{ .Values.publisher.cli.downloadUrl | quote }}}
            - {name: CLI_SHA256, value: {{ .Values.publisher.cli.sha256 | quote }}}
            - {name: UPDATE_STRATEGY, value: {{ .Values.dashboards.updateStrategy | quote }}}
{{- if .Values.publisher.caSecret }}
            - {name: CA_PATH, value: /ca/ca.crt}
{{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
{{ toYaml .Values.publisher.resources | indent 12 }}
          volumeMounts:
            - {name: definitions, mountPath: /definitions, readOnly: true}
            - {name: work, mountPath: /work}
{{- if .Values.publisher.caSecret }}
            - {name: ca, mountPath: /ca, readOnly: true}
{{- end }}
      volumes:
        - name: definitions
          configMap: {name: {{ .Release.Name }}-{{ $kind }}-definitions}
        - name: work
          emptyDir: {sizeLimit: 256Mi}
{{- if .Values.publisher.caSecret }}
        - name: ca
          secret:
            secretName: {{ .Values.publisher.caSecret }}
            items: [{key: {{ .Values.publisher.caKey }}, path: ca.crt}]
{{- end }}

{{- end }}
{{- end }}
{{- end }}
