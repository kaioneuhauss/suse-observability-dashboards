name: Validate Helm integration
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        helm: [v3.19.0, v4.1.1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: azure/setup-helm@v4
        with:
          version: ${{ matrix.helm }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: bash tests/helm-checks.sh
      - name: Verify generated charts
        run: |
          python scripts/enhance-dashboards.py
          python scripts/build-virtualization-dashboards.py
          python scripts/curate-dashboards.py
          python scripts/build-charts.py
          git diff --exit-code -- charts/ examples/ components/
      - name: Validate each independent module
        run: |
          for module in virtualization traefik applications kubernetes imports; do
            helm lint "charts/suse-observability-$module" --strict -f "examples/$module.yaml"
          done
      - name: Package each chart
        run: |
          mkdir -p /tmp/helm-packages
          for chart in charts/*; do
            helm package "$chart" --destination /tmp/helm-packages
          done
