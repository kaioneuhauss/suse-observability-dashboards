{{- if and .Values.longhorn.enabled .Values.longhorn.allowMetricsNetworkPolicy }}
{{- if not .Values.longhorn.existingIsolationConfirmed }}{{ fail "Confirm existing Longhorn isolation with virtualization.longhorn.existingIsolationConfirmed=true before adding the metrics rule" }}{{ end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-longhorn-metrics
  namespace: {{ .Values.longhorn.namespace }}
spec:
  podSelector:
    matchLabels: {app: longhorn-manager}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: {{ .Release.Namespace | quote }}}
          podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/name: sre-kubevirt-telemetry
      ports: [{protocol: TCP, port: 9500}]
{{- end }}
