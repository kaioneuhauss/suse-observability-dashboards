# Edite este arquivo. O namespace de destino fica no comando Helm/fleet.yaml.
# Nome do cluster = STS_CLUSTER_NAME do Agent; nao necessariamente o contexto.
clusterName: observability-cluster
remoteWrite:
  url: https://observability.neuhauss.com.br/receiver/prometheus/api/v1/write
  existingSecret: suse-observability-agent-secrets
  secretKey: STS_API_KEY
etcd:
  enabled: true
traefik:
  enabled: true
  allowMetricsNetworkPolicy: false
  existingIsolationConfirmed: false
nodeExporter:
  pressureEnabled: false
safety:
  profile: conservative
  cardinality:
    mode: observe
