mode: all
clusterName: ''
observability:
  url: ''
  remoteWriteUrl: ''
  otlpEndpoint: ''
ingestion:
  existingSecret: suse-observability-agent-secrets
  secretKey: STS_API_KEY
auth:
  dashboards:
    existingSecret: suse-observability-publisher-token
    serviceTokenKey: serviceToken
  monitors:
    existingSecret: suse-observability-publisher-token
    serviceTokenKey: serviceToken
lifecycle:
  action: apply
  confirmDelete: ''
  revision: '1'
slo:
  availabilityTarget: 99.9
content:
  publisher:
    image: python:3.12-alpine
    imagePullPolicy: IfNotPresent
    imagePullSecrets: []
    cli:
      path: ''
      downloadUrl: https://dl.stackstate.com/stackstate-cli/v3.3.6/stackstate-cli-3.3.6.linux-x86_64.tar.gz
      sha256: 12eb322d6670a677b21a29f645c929fb0f34d9009952deb95e7eb93cafbd8543
    caSecret: ''
    caKey: ca.crt
    activeDeadlineSeconds: 900
    ttlSecondsAfterFinished: 86400
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
        ephemeral-storage: 96Mi
      limits:
        cpu: 200m
        memory: 192Mi
        ephemeral-storage: 320Mi
    nodeSelector:
      kubernetes.io/os: linux
      kubernetes.io/arch: amd64
    tolerations: []
  dashboards:
    enabled: true
    include:
    - imports
    updateStrategy: replace
  monitors:
    enabled: false
    include: []
  slo:
    availabilityTarget: 99.9
imports:
  remoteWrite:
    username: apikey
    caSecret: ''
    caKey: ca.crt
    forcePrometheusProtocol: true
  scrapeInterval: 30s
  scrapeTimeout: 10s
  vmagent:
    image: registry.rancher.com/suse-observability/vmagent:1.144.0-so6
    nodePort: 18429
    etcdPort: 18430
    queueMaxDiskMiB: 1024
    selfMonitoring: true
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
        ephemeral-storage: 128Mi
      limits:
        cpu: 150m
        memory: 128Mi
        ephemeral-storage: 1536Mi
    memoryAllowedBytes: 64MiB
    maxScrapeSize: 16MiB
  nodeSelector:
    kubernetes.io/os: linux
  tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
  - key: node-role.kubernetes.io/master
    operator: Exists
    effect: NoSchedule
  - key: node-role.kubernetes.io/etcd
    operator: Exists
    effect: NoExecute
  imagePullSecrets: []
  inventory:
    image: python:3.12-alpine
    pollIntervalSeconds: 30
    resources:
      requests:
        cpu: 5m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 96Mi
