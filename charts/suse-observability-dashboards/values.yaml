observability:
  # Required: public URL of the target SUSE Observability instance.
  url: ""

auth:
  existingSecret: suse-observability-dashboard-token
  serviceTokenKey: serviceToken

runner:
  caSecret: ""
  caKey: ca.crt
  image:
    repository: alpine
    tag: "3.22"
    pullPolicy: IfNotPresent
  cli:
    version: "3.3.6"
    downloadUrl: https://dl.stackstate.com/stackstate-cli/v3.3.6/stackstate-cli-3.3.6.linux-x86_64.tar.gz
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 86400
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi

dashboards:
  enabled: true
  includeTraefik: true
  legacyNames:
    "Dashboard - Instrumented apps":
      - "Application SRE Overview"
      - "Aplicações - Saúde, Tráfego e Auditoria Operacional"
    "Workload Resource Efficiency":
      - "Aplicações - Recursos, Requests e Limits"
    "Kubernetes Platform Health":
      - "Plataforma - Saúde Multi-cluster e etcd"

# Optional native Traefik Prometheus collection. It is disabled by default so
# the chart never assumes a particular ingress implementation.
traefikMetrics:
  enabled: false
  clusterName: ""
  workloadNamespace: kube-system
  selector:
    app.kubernetes.io/name: rke2-traefik
  targetPort: metrics
  port: 9100
  scrapeInterval: 15s
  remoteWriteUrl: ""
  image:
    repository: registry.rancher.com/suse-observability/vmagent
    tag: 1.144.0-so6
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 96Mi

podAnnotations: {}
podLabels: {}
