{{- if .Values.dashboards.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "suse-observability-dashboards.fullname" . }}
  labels:
    {{- include "suse-observability-dashboards.labels" . | nindent 4 }}
data:
  dashboard-aliases.txt: |
{{- range $currentName, $legacyNames := .Values.dashboards.legacyNames }}
{{- range $legacyName := $legacyNames }}
    {{ $currentName }}|{{ $legacyName }}
{{- end }}
{{- end }}
{{- range $path, $_ := .Files.Glob "dashboards/*.yaml" }}
{{- if or $.Values.dashboards.includeTraefik (ne (base $path) "04-traefik-ingress-health.yaml") }}
  {{ base $path }}: |
{{ $.Files.Get $path | indent 4 }}
{{- end }}
{{- end }}
{{- end }}
