{{- if .Values.traefikMetrics.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "suse-observability-dashboards.traefikMetricsName" . }}
  namespace: {{ .Values.traefikMetrics.workloadNamespace }}
  labels:
    {{- include "suse-observability-dashboards.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: false
  selector:
    {{- toYaml .Values.traefikMetrics.selector | nindent 4 }}
  ports:
    - name: metrics
      port: {{ .Values.traefikMetrics.port }}
      targetPort: {{ .Values.traefikMetrics.targetPort }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "suse-observability-dashboards.traefikCollectorName" . }}
  labels:
    {{- include "suse-observability-dashboards.labels" . | nindent 4 }}
data:
  prometheus.yml: |
    global:
      scrape_interval: {{ .Values.traefikMetrics.scrapeInterval | quote }}
    scrape_configs:
      - job_name: traefik
        dns_sd_configs:
          - names:
              - {{ printf "%s.%s.svc" (include "suse-observability-dashboards.traefikMetricsName" .) .Values.traefikMetrics.workloadNamespace | quote }}
            type: A
            port: {{ .Values.traefikMetrics.port }}
        relabel_configs:
          - target_label: cluster_name
            replacement: {{ required "traefikMetrics.clusterName is required when enabled" .Values.traefikMetrics.clusterName | quote }}
          - target_label: namespace
            replacement: {{ .Values.traefikMetrics.workloadNamespace | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "suse-observability-dashboards.traefikCollectorName" . }}
  labels:
    {{- include "suse-observability-dashboards.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "suse-observability-dashboards.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: traefik-vmagent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "suse-observability-dashboards.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: traefik-vmagent
      annotations:
        checksum/traefik-scrape-config: {{ toYaml .Values.traefikMetrics | sha256sum }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: vmagent
          image: {{ printf "%s:%s" .Values.traefikMetrics.image.repository .Values.traefikMetrics.image.tag | quote }}
          imagePullPolicy: {{ .Values.traefikMetrics.image.pullPolicy }}
          args:
            - -promscrape.config=/etc/vmagent/prometheus.yml
            - {{ printf "-remoteWrite.url=%s" (required "traefikMetrics.remoteWriteUrl is required when enabled" .Values.traefikMetrics.remoteWriteUrl) | quote }}
            - -remoteWrite.tmpDataPath=/var/lib/vmagent
            - -remoteWrite.forcePromProto=true
            - -remoteWrite.maxDiskUsagePerURL=1024MiB
            - -memory.allowedBytes=32MiB
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          resources:
            {{- toYaml .Values.traefikMetrics.resources | nindent 12 }}
          volumeMounts:
            - {name: config, mountPath: /etc/vmagent/prometheus.yml, subPath: prometheus.yml, readOnly: true}
            - {name: queue, mountPath: /var/lib/vmagent}
      volumes:
        - {name: config, configMap: {name: {{ include "suse-observability-dashboards.traefikCollectorName" . }}}}
        - {name: queue, emptyDir: {sizeLimit: 1280Mi}}
{{- end }}
