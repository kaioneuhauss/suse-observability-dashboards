name: Traefik Ingress Health
description: Incoming application traffic, errors, response times, and certificate expiry.
scope: publicDashboard
dashboard:
  metadata:
    project: '{"saveVariables":false}'
  spec:
    layouts:
    - kind: Grid
      spec:
        items:
        - x: 0
          y: 0
          width: 24
          height: 2
          content:
            $ref: '#/spec/panels/guide'
        - x: 0
          y: 2
          width: 12
          height: 2
          content:
            $ref: '#/spec/panels/rps'
        - x: 12
          y: 2
          width: 12
          height: 2
          content:
            $ref: '#/spec/panels/rpsRecent'
        - x: 0
          y: 4
          width: 12
          height: 2
          content:
            $ref: '#/spec/panels/meanLatency'
        - x: 12
          y: 4
          width: 12
          height: 2
          content:
            $ref: '#/spec/panels/p95'
        - x: 0
          y: 6
          width: 24
          height: 3
          content:
            $ref: '#/spec/panels/requestRate'
        - x: 0
          y: 9
          width: 24
          height: 3
          content:
            $ref: '#/spec/panels/latency'
        - x: 0
          y: 12
          width: 12
          height: 2
          content:
            $ref: '#/spec/panels/requests1h'
        - x: 12
          y: 12
          width: 12
          height: 2
          content:
            $ref: '#/spec/panels/requests24h'
        - x: 0
          y: 14
          width: 12
          height: 2
          content:
            $ref: '#/spec/panels/client4xx'
        - x: 12
          y: 14
          width: 12
          height: 2
          content:
            $ref: '#/spec/panels/error5xx'
        - x: 0
          y: 16
          width: 24
          height: 3
          content:
            $ref: '#/spec/panels/errorTimeline'
        - x: 0
          y: 19
          width: 8
          height: 2
          content:
            $ref: '#/spec/panels/serviceCount'
        - x: 8
          y: 19
          width: 8
          height: 2
          content:
            $ref: '#/spec/panels/openConnections'
        - x: 16
          y: 19
          width: 8
          height: 2
          content:
            $ref: '#/spec/panels/history'
        - x: 0
          y: 21
          width: 24
          height: 3
          content:
            $ref: '#/spec/panels/tlsExpiry'
        - x: 0
          y: 24
          width: 24
          height: 3
          content:
            $ref: '#/spec/panels/serviceRequests24h'
        - x: 0
          y: 27
          width: 12
          height: 3
          content:
            $ref: '#/spec/panels/serviceTraffic'
        - x: 12
          y: 27
          width: 12
          height: 3
          content:
            $ref: '#/spec/panels/serviceErrorRatio'
        - x: 0
          y: 30
          width: 12
          height: 3
          content:
            $ref: '#/spec/panels/byCode'
        - x: 12
          y: 30
          width: 12
          height: 3
          content:
            $ref: '#/spec/panels/serviceLatency'
        - x: 0
          y: 33
          width: 24
          height: 3
          content:
            $ref: '#/spec/panels/bandwidth'
        - x: 0
          y: 36
          width: 24
          height: 3
          content:
            $ref: '#/spec/panels/codeTotals'
    panels:
      guide:
        spec:
          display:
            name: How to read incoming traffic
            description: HTTP at the proxy includes health checks, APIs, authentication, and other automated calls.
          plugin:
            kind: Markdown
            spec:
              text: '**Traefik is the entry point for applications.** These metrics do not require instrumentation inside each application. Requests include automated health checks, APIs, and other machine traffic; they are not people or business visits. Totals are rounded estimates over moving time windows. Collection gaps leave incomplete history. **Compare the same application and time window.** Five-minute rates smooth short tests; the recent rate still averages the latest scrape interval, normally 30 seconds. **Response time means how long a request takes to get a response, measured by Traefik.** 1000 ms = 1 second. **Average:** add the response times and divide by the number of requests. Three calls taking 50, 100, and 150 ms have an average of 100 ms. **p95:** if it shows 200 ms, about 95 out of 100 calls finished within 200 ms; the other five took longer. Browser timing also includes the connection to Traefik. Certificates and open connections remain cluster-wide. Negative certificate
                days mean expired. After changing the cluster, reset namespace and application to Everything.'
          queries: []
      rps:
        spec:
          display:
            name: Requests per second · five-minute average
            description: Requests averaged over five minutes. A brief load test is diluted by the quiet part of that window. Select its application before comparing traffic.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                decimalPlaces: 2
                unit: reqps
              sparkline: false
              valueFontSize: 40
              thresholds:
                defaultColor: '#1976B9'
                steps: []
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  alias: Requests/s
                  query: last_over_time((sum((sum by (cluster_name,service,protocol,code,method) ((max by (cluster_name,instance,service,protocol,code,method,le) (rate(traefik_service_requests_total{cluster_name=~"${ingress_cluster}",protocol="http"}[5m]))) or ((label_replace(rate(_traefik_service_requests{cluster_name=~"${ingress_cluster}",protocol="http",traefik_backend!=""}[5m]), "service", "$1", "traefik_backend", "(.*)")) unless on (cluster_name) (max by (cluster_name,instance,service,protocol,code,method,le) (rate(traefik_service_requests_total{cluster_name=~"${ingress_cluster}",protocol="http"}[5m])))))) * on (cluster_name,service) group_left(namespace,backend) ((max by (cluster_name,namespace,service,backend) (label_replace(last_over_time(sre_ingress_backend_info{cluster_name=~"${ingress_cluster}",ingress_namespace!="",ingress_namespace=~"${ingress_namespace}",backend=~"${ingress_service}"}[5m]), "namespace", "$1", "ingress_namespace", "(.*)"))) or ((max by (cluster_name,namespace,service,backend)
                    (label_replace(label_join(label_replace(last_over_time(kubernetes_state_ingress_path{cluster_name=~"${ingress_cluster}",namespace=~"${ingress_namespace}",service=~"${ingress_service}"}[5m]), "backend", "$1", "service", "(.*)"), "service_key", "-", "namespace", "service", "kube_service_port"), "service", "$1@kubernetes", "service_key", "(.*)"))) unless on (cluster_name) (last_over_time(sre_ingress_inventory_success{cluster_name=~"${ingress_cluster}"}[5m]))))))[1s:1s] @ end())
      rpsRecent:
        spec:
          display:
            name: Requests per second · latest sample interval
            description: Counter change divided by elapsed time between the latest two scrapes, normally about 30 seconds. This is not an exact one-second peak or the achieved rate of a shorter benchmark. Missing or stale samples are not zero traffic.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                decimalPlaces: 2
                unit: reqps
              sparkline: false
              valueFontSize: 40
              thresholds:
                defaultColor: '#1976B9'
                steps: []
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  alias: Recent requests/s
                  query: last_over_time((sum((sum by (cluster_name,service,protocol,code,method) ((max by (cluster_name,instance,service,protocol,code,method,le) (irate(traefik_service_requests_total{cluster_name=~"${ingress_cluster}",protocol="http"}[2m]))) or ((label_replace(irate(_traefik_service_requests{cluster_name=~"${ingress_cluster}",protocol="http",traefik_backend!=""}[2m]), "service", "$1", "traefik_backend", "(.*)")) unless on (cluster_name) (max by (cluster_name,instance,service,protocol,code,method,le) (irate(traefik_service_requests_total{cluster_name=~"${ingress_cluster}",protocol="http"}[2m])))))) * on (cluster_name,service) group_left(namespace,backend) ((max by (cluster_name,namespace,service,backend) (label_replace(last_over_time(sre_ingress_backend_info{cluster_name=~"${ingress_cluster}",ingress_namespace!="",ingress_namespace=~"${ingress_namespace}",backend=~"${ingress_service}"}[5m]), "namespace", "$1", "ingress_namespace", "(.*)"))) or ((max by (cluster_name,namespace,service,backend)
                    (label_replace(label_join(label_replace(last_over_time(kubernetes_state_ingress_path{cluster_name=~"${ingress_cluster}",namespace=~"${ingress_namespace}",service=~"${ingress_service}"}[5m]), "backend", "$1", "service", "(.*)"), "service_key", "-", "namespace", "service", "kube_service_port"), "service", "$1@kubernetes", "service_key", "(.*)"))) unless on (cluster_name) (last_over_time(sre_ingress_inventory_success{cluster_name=~"${ingress_cluster}"}[5m]))))))[1s:1s] @ end())
      meanLatency:
        spec:
          display:
            name: Average response time · last five minutes · ms
            description: 'How long a request takes on average to get a response, measured by Traefik for the selected applications. Add all response times and divide by the number of completed requests. Example: calls taking 50, 100, and 150 ms give an average of 100 ms. Lower means faster responses. A few slow calls can be hidden by this average; also check the 95-of-100 response time. Browser timing includes extra network time. Without completed requests, this value is unavailable.'
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                decimalPlaces: 2
                unit: none
              sparkline: false
              valueFontSize: 40
              thresholds:
                defaultColor: '#1976B9'
                steps: []
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  alias: Average response time
                  query: (last_over_time((sum((sum by (cluster_name,service,protocol,code,method) ((max by (cluster_name,instance,service,protocol,code,method,le) (rate(traefik_service_request_duration_seconds_sum{cluster_name=~"${ingress_cluster}",protocol="http"}[5m]))) or ((label_replace(rate(_traefik_service_request_duration_seconds_sum{cluster_name=~"${ingress_cluster}",protocol="http",traefik_backend!=""}[5m]), "service", "$1", "traefik_backend", "(.*)")) unless on (cluster_name) (max by (cluster_name,instance,service,protocol,code,method,le) (rate(traefik_service_request_duration_seconds_sum{cluster_name=~"${ingress_cluster}",protocol="http"}[5m])))))) * on (cluster_name,service) group_left(namespace,backend) ((max by (cluster_name,namespace,service,backend) (label_replace(last_over_time(sre_ingress_backend_info{cluster_name=~"${ingress_cluster}",ingress_namespace!="",ingress_namespace=~"${ingress_namespace}",backend=~"${ingress_service}"}[5m]), "namespace", "$1", "ingress_namespace",
                    "(.*)"))) or ((max by (cluster_name,namespace,service,backend) (label_replace(label_join(label_replace(last_over_time(kubernetes_state_ingress_path{cluster_name=~"${ingress_cluster}",namespace=~"${ingress_namespace}",service=~"${ingress_service}"}[5m]), "backend", "$1", "service", "(.*)"), "service_key", "-", "namespace", "service", "kube_service_port"), "service", "$1@kubernetes", "service_key", "(.*)"))) unless on (cluster_name) (last_over_time(sre_ingress_inventory_success{cluster_name=~"${ingress_cluster}"}[5m]))))) / (sum((sum by (cluster_name,service,protocol,code,method) ((max by (cluster_name,instance,service,protocol,code,method,le) (rate(traefik_service_request_duration_seconds_count{cluster_name=~"${ingress_cluster}",protocol="http"}[5m]))) or ((label_replace(rate(_traefik_service_request_duration_seconds_count{cluster_name=~"${ingress_cluster}",protocol="http",traefik_backend!=""}[5m]), "service", "$1", "traefik_backend", "(.*)")) unless on (cluster_name)
                    (max by (cluster_name,instance,service,protocol,code,method,le) (rate(traefik_service_request_duration_seconds_count{cluster_name=~"${ingress_cluster}",protocol="http"}[5m])))))) * on (cluster_name,service) group_left(namespace,backend) ((max by (cluster_name,namespace,service,backend) (label_replace(last_over_time(sre_ingress_backend_info{cluster_name=~"${ingress_cluster}",ingress_namespace!="",ingress_namespace=~"${ingress_namespace}",backend=~"${ingress_service}"}[5m]), "namespace", "$1", "ingress_namespace", "(.*)"))) or ((max by (cluster_name,namespace,service,backend) (label_replace(label_join(label_replace(last_over_time(kubernetes_state_ingress_path{cluster_name=~"${ingress_cluster}",namespace=~"${ingress_namespace}",service=~"${ingress_service}"}[5m]), "backend", "$1", "service", "(.*)"), "service_key", "-", "namespace", "service", "kube_service_port"), "service", "$1@kubernetes", "service_key", "(.*)"))) unless on (cluster_name) (last_over_time(sre_ingress_inventory_success{cluster_name=~"${ingress_cluster}"}[5m])))))
                    > 0))[1s:1s] @ end())) * 1000
      requestRate:
        spec:
          display:
            name: Requests per second · recent traffic and five-minute average
            description: The recent line uses the latest two scrapes, normally 30 seconds apart; the average line uses five minutes. Hover over the test period. A short burst can be lower than the benchmark rate in both lines.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: right
                show: true
                values: []
              thresholds:
                mode: absolute
                steps: []
              visual:
                connectNulls: false
              yAxis:
                format:
                  decimalPlaces: 2
                  unit: reqps
                show: true
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  alias: Latest sample interval
                  query: sum((sum by (cluster_name,service,protocol,code,method) ((max by (cluster_name,instance,service,protocol,code,method,le) (irate(traefik_service_requests_total{cluster_name=~"${ingress_cluster}",protocol="http"}[2m]))) or ((label_replace(irate(_traefik_service_requests{cluster_name=~"${ingress_cluster}",protocol="http",traefik_backend!=""}[2m]), "service", "$1", "traefik_backend", "(.*)")) unless on (cluster_name) (max by (cluster_name,instance,service,protocol,code,method,le) (irate(traefik_service_requests_total{cluster_name=~"${ingress_cluster}",protocol="http"}[2m])))))) * on (cluster_name,service) group_left(namespace,backend) ((max by (cluster_name,namespace,service,backend) (label_replace(sre_ingress_backend_info{cluster_name=~"${ingress_cluster}",ingress_namespace!="",ingress_namespace=~"${ingress_namespace}",backend=~"${ingress_service}"}, "namespace", "$1", "ingress_namespace", "(.*)"))) or ((max by (cluster_name,namespace,service,backend) (label_replace(label_join(label_replace(kubernetes_state_ingress_path{cluster_name=~"${ingress_cluster}",namespace=~"${ingress_namespace}",service=~"${ingress_service}"},
                    "backend", "$1", "service", "(.*)"), "service_key", "-", "namespace", "service", "kube_service_port"), "service", "$1@kubernetes", "service_key", "(.*)"))) unless on (cluster_name) (sre_ingress_inventory_success{cluster_name=~"${ingress_cluster}"}))))
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  alias: Five-minute average
                  query: sum((sum by (cluster_name,service,protocol,code,method) ((max by (cluster_name,instance,service,protocol,code,method,le) (rate(traefik_service_requests_total{cluster_name=~"${ingress_cluster}",protocol="http"}[5m]))) or ((label_replace(rate(_traefik_service_requests{cluster_name=~"${ingress_cluster}",protocol="http",traefik_backend!=""}[5m]), "service", "$1", "traefik_backend", "(.*)")) unless on (cluster_name) (max by (cluster_name,instance,service,protocol,code,method,le) (rate(traefik_service_requests_total{cluster_name=~"${ingress_cluster}",protocol="http"}[5m])))))) * on (cluster_name,service) group_left(namespace,backend) ((max by (cluster_name,namespace,service,backend) (label_replace(sre_ingress_backend_info{cluster_name=~"${ingress_cluster}",ingress_namespace!="",ingress_namespace=~"${ingress_namespace}",backend=~"${ingress_service}"}, "namespace", "$1", "ingress_namespace", "(.*)"))) or ((max by (cluster_name,namespace,service,backend) (label_replace(label_join(label_replace(kubernetes_state_ingress_path{cluster_name=~"${ingress_cluster}",namespace=~"${ingress_namespace}",service=~"${ingress_service}"},
                    "backend", "$1", "service", "(.*)"), "service_key", "-", "namespace", "service", "kube_service_port"), "service", "$1@kubernetes", "service_key", "(.*)"))) unless on (cluster_name) (sre_ingress_inventory_success{cluster_name=~"${ingress_cluster}"}))))
      requests1h:
        spec:
          display:
            name: Completed requests · last hour
            description: Estimated completed HTTP requests in a moving one-hour window. Includes health checks and does not count people.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                decimalPlaces: 0
                unit: none
              sparkline: false
              valueFontSize: 40
              thresholds:
                defaultColor: '#1976B9'
                steps: []
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  alias: Requests
                  query: last_over_time((round(sum((sum by (cluster_name,service,protocol,code,method) ((max by (cluster_name,instance,service,protocol,code,method,le) (increase(traefik_service_requests_total{cluster_name=~"${ingress_cluster}",protocol="http"}[1h]))) or ((label_replace(increase(_traefik_service_requests{cluster_name=~"${ingress_cluster}",protocol="http",traefik_backend!=""}[1h]), "service", "$1", "traefik_backend", "(.*)")) unless on (cluster_name) (max by (cluster_name,instance,service,protocol,code,method,le) (increase(traefik_service_requests_total{cluster_name=~"${ingress_cluster}",protocol="http"}[1h])))))) * on (cluster_name,service) group_left(namespace,backend) ((max by (cluster_name,namespace,service,backend) (label_replace(last_over_time(sre_ingress_backend_info{cluster_name=~"${ingress_cluster}",ingress_namespace!="",ingress_namespace=~"${ingress_namespace}",backend=~"${ingress_service}"}[5m]), "namespace", "$1", "ingress_namespace", "(.*)"))) or ((max by (cluster_name,namespace,service,backend)
                    (label_replace(label_join(label_replace(last_over_time(kubernetes_state_ingress_path{cluster_name=~"${ingress_cluster}",namespace=~"${ingress_namespace}",service=~"${ingress_service}"}[5m]), "backend", "$1", "service", "(.*)"), "service_key", "-", "namespace", "service", "kube_service_port"), "service", "$1@kubernetes", "service_key", "(.*)"))) unless on (cluster_name) (last_over_time(sre_ingress_inventory_success{cluster_name=~"${ingress_cluster}"}[5m]))))), 1))[1s:1s] @ end())
      requests24h:
        spec:
          display:
            name: Completed requests · last 24 hours
            description: Observed HTTP requests within a moving 24-hour window. Incomplete collection does not represent a full day of demand.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                decimalPlaces: 0
                unit: none
              sparkline: false
              valueFontSize: 40
              thresholds:
                defaultColor: '#7651A8'
                steps: []
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  alias: Requests
                  query: last_over_time((round(sum((sum by (cluster_name,service,protocol,code,method) ((max by (cluster_name,instance,service,protocol,code,method,le) (increase(traefik_service_requests_total{cluster_name=~"${ingress_cluster}",protocol="http"}[24h]))) or ((label_replace(increase(_traefik_service_requests{cluster_name=~"${ingress_cluster}",protocol="http",traefik_backend!=""}[24h]), "service", "$1", "traefik_backend", "(.*)")) unless on (cluster_name) (max by (cluster_name,instance,service,protocol,code,method,le) (increase(traefik_service_requests_total{cluster_name=~"${ingress_cluster}",protocol="http"}[24h])))))) * on (cluster_name,service) group_left(namespace,backend) ((max by (cluster_name,namespace,service,backend) (label_replace(last_over_time(sre_ingress_backend_info{cluster_name=~"${ingress_cluster}",ingress_namespace!="",ingress_namespace=~"${ingress_namespace}",backend=~"${ingress_service}"}[5m]), "namespace", "$1", "ingress_namespace", "(.*)"))) or ((max by (cluster_name,namespace,service,backend)
                    (label_replace(label_join(label_replace(last_over_time(kubernetes_state_ingress_path{cluster_name=~"${ingress_cluster}",namespace=~"${ingress_namespace}",service=~"${ingress_service}"}[5m]), "backend", "$1", "service", "(.*)"), "service_key", "-", "namespace", "service", "kube_service_port"), "service", "$1@kubernetes", "service_key", "(.*)"))) unless on (cluster_name) (last_over_time(sre_ingress_inventory_success{cluster_name=~"${ingress_cluster}"}[5m]))))), 1))[1s:1s] @ end())
      client4xx:
        spec:
          display:
            name: HTTP 4xx responses · last hour
            description: Rejected or invalid HTTP requests. Authentication failures and unknown addresses need context before they are classified as incidents.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                decimalPlaces: 0
                unit: none
              sparkline: false
              valueFontSize: 40
              thresholds:
                defaultColor: '#2E8540'
                steps:
                - color: '#E69F00'
                  value: 1
                - color: '#D32F2F'
                  value: 100
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  alias: 4xx
                  query: last_over_time((round((sum((sum by (cluster_name,service,protocol,code,method) ((max by (cluster_name,instance,service,protocol,code,method,le) (increase(traefik_service_requests_total{cluster_name=~"${ingress_cluster}",protocol="http",code=~"4.."}[1h]))) or ((label_replace(increase(_traefik_service_requests{cluster_name=~"${ingress_cluster}",protocol="http",code=~"4..",traefik_backend!=""}[1h]), "service", "$1", "traefik_backend", "(.*)")) unless on (cluster_name) (max by (cluster_name,instance,service,protocol,code,method,le) (increase(traefik_service_requests_total{cluster_name=~"${ingress_cluster}",protocol="http",code=~"4.."}[1h])))))) * on (cluster_name,service) group_left(namespace,backend) ((max by (cluster_name,namespace,service,backend) (label_replace(last_over_time(sre_ingress_backend_info{cluster_name=~"${ingress_cluster}",ingress_namespace!="",ingress_namespace=~"${ingress_namespace}",backend=~"${ingress_service}"}[5m]), "namespace", "$1", "ingress_namespace",
                    "(.*)"))) or ((max by (cluster_name,namespace,service,backend) (label_replace(label_join(label_replace(last_over_time(kubernetes_state_ingress_path{cluster_name=~"${ingress_cluster}",namespace=~"${ingress_namespace}",service=~"${ingress_service}"}[5m]), "backend", "$1", "service", "(.*)"), "service_key", "-", "namespace", "service", "kube_service_port"), "service", "$1@kubernetes", "service_key", "(.*)"))) unless on (cluster_name) (last_over_time(sre_ingress_inventory_success{cluster_name=~"${ingress_cluster}"}[5m]))))) or (sum((sum by (cluster_name,service,protocol,code,method) ((max by (cluster_name,instance,service,protocol,code,method,le) (increase(traefik_service_requests_total{cluster_name=~"${ingress_cluster}",protocol="http"}[1h]))) or ((label_replace(increase(_traefik_service_requests{cluster_name=~"${ingress_cluster}",protocol="http",traefik_backend!=""}[1h]), "service", "$1", "traefik_backend", "(.*)")) unless on (cluster_name) (max by (cluster_name,instance,service,protocol,code,method,le)
                    (increase(traefik_service_requests_total{cluster_name=~"${ingress_cluster}",protocol="http"}[1h])))))) * on (cluster_name,service) group_left(namespace,backend) ((max by (cluster_name,namespace,service,backend) (label_replace(last_over_time(sre_ingress_backend_info{cluster_name=~"${ingress_cluster}",ingress_namespace!="",ingress_namespace=~"${ingress_namespace}",backend=~"${ingress_service}"}[5m]), "namespace", "$1", "ingress_namespace", "(.*)"))) or ((max by (cluster_name,namespace,service,backend) (label_replace(label_join(label_replace(last_over_time(kubernetes_state_ingress_path{cluster_name=~"${ingress_cluster}",namespace=~"${ingress_namespace}",service=~"${ingress_service}"}[5m]), "backend", "$1", "service", "(.*)"), "service_key", "-", "namespace", "service", "kube_service_port"), "service", "$1@kubernetes", "service_key", "(.*)"))) unless on (cluster_name) (last_over_time(sre_ingress_inventory_success{cluster_name=~"${ingress_cluster}"}[5m]))))) * 0)), 1))[1s:1s]
                    @ end())
      error5xx:
        spec:
          display:
            name: HTTP 5xx responses · last hour
            description: Server or proxy failures. Identify the affected application. Initial color references are one and ten responses.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                decimalPlaces: 0
                unit: none
              sparkline: false
              valueFontSize: 40
              thresholds:
