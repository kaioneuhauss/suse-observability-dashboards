        - x: 0
          y: 50
          width: 12
          height: 3
          content:
            $ref: '#/spec/panels/etcdWAL'
        - x: 12
          y: 50
          width: 12
          height: 3
          content:
            $ref: '#/spec/panels/etcdCommit'
        - x: 0
          y: 53
          width: 12
          height: 3
          content:
            $ref: '#/spec/panels/etcdPeer'
        - x: 12
          y: 53
          width: 12
          height: 3
          content:
            $ref: '#/spec/panels/etcdDB'
        - x: 0
          y: 56
          width: 12
          height: 3
          content:
            $ref: '#/spec/panels/collectorQueue'
        - x: 12
          y: 56
          width: 12
          height: 3
          content:
            $ref: '#/spec/panels/collectorRetries'
    panels:
      guide:
        spec:
          display:
            name: How to check platform health
            description: Availability, capacity, and collection coverage answer different questions. Check all three before drawing a conclusion.
          plugin:
            kind: Markdown
            spec:
              text: '**Start with available nodes, collection coverage, and pods needing attention.** Namespace filters applications and PVCs; nodes, host disks, PVs, and etcd remain cluster-wide. Disk rows identify the server, mount, and device. Do not add repeated mounts of the same disk. **Used** is occupied space; **capacity** is the filesystem size. Block volumes need measurements inside the VM; missing data does not mean 0% or 100% used. Linux **pressure stall information (PSI)** requires kernel support; its two charts have no data on unsupported kernels. The etcd section explains its own signals. Monitor descriptions state the threshold, duration, and next action. Circular gauges show the highest selected utilization, not the average across resources; orange starts at 80% and red at 90%. The named resource may change as utilization changes.'
          queries: []
      ready:
        spec:
          display:
            name: Nodes available to Kubernetes · %
            description: Share of known nodes with the Ready condition. This does not prove that every metrics collector is working.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                decimalPlaces: 0
                unit: percentunit
              sparkline: false
              valueFontSize: 40
              thresholds:
                defaultColor: '#1976B9'
                steps: []
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  alias: Value
                  query: last_over_time((sum(last_over_time(kubernetes_state_node_by_condition{cluster_name=~"${platform_cluster}",condition="Ready",status="true"}[5m])) / count(max by (cluster_name,node) (last_over_time(kubernetes_state_node_age{cluster_name=~"${platform_cluster}"}[5m]) * 0 + 1)))[1s:1s] @ end())
      coverage:
        spec:
          display:
            name: Nodes with working OS collection · %
            description: Healthy OS collectors divided by known nodes. Below 100% means at least one server is missing visibility.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                decimalPlaces: 0
                unit: percentunit
              sparkline: false
              valueFontSize: 40
              thresholds:
                defaultColor: '#1976B9'
                steps: []
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  alias: Value
                  query: last_over_time((count(max by (cluster_name,node) (last_over_time(up{cluster_name=~"${platform_cluster}",job="sre-node"}[5m]) == 1)) / count(max by (cluster_name,node) (last_over_time(kubernetes_state_node_age{cluster_name=~"${platform_cluster}"}[5m]) * 0 + 1)))[1s:1s] @ end())
      nonRunning:
        spec:
          display:
            name: Pods needing a check · count
            description: Pods outside Running or Succeeded at the selected end time. Pending can be temporary during creation or an update.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                decimalPlaces: 0
                unit: none
              sparkline: false
              valueFontSize: 40
              thresholds:
                defaultColor: '#1976B9'
                steps: []
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  alias: Pods
                  query: last_over_time(((sum(max by (cluster_name,namespace,pod_name,pod_phase) (last_over_time(kubernetes_state_pod_status_phase{cluster_name=~"${platform_cluster}",namespace=~"${platform_namespace}",pod_phase!~"Running|Succeeded"}[5m] @ end()) == 1))) or (sum(last_over_time(kubernetes_state_pod_status_phase{cluster_name=~"${platform_cluster}",namespace=~"${platform_namespace}"}[5m])) * 0))[1s:1s] @ end())
      nonRunningList:
        spec:
          display:
            name: Which pods need a check
            description: Namespace, pod, and current phase. Interpret an empty list together with collection coverage.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                show: true
                values: []
              thresholds:
                mode: absolute
                steps: []
              visual:
                connectNulls: false
              yAxis:
                format:
                  decimalPlaces: 0
                  unit: none
                show: false
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  alias: ${sre_series}
                  query: max by (sre_series) (label_join(((label_join(max by (cluster_name,namespace,pod_name,pod_phase) (last_over_time(kubernetes_state_pod_status_phase{cluster_name=~"${platform_cluster}",namespace=~"${platform_namespace}",pod_phase!~"Running|Succeeded"}[5m] @ end()) == 1), "item", " · ", "cluster_name", "namespace", "pod_name", "pod_phase")) or on() label_replace(vector(0), "item", "No matching items; check filters and collection coverage", "", "")), "sre_series", "", "item"))
      restarts:
        spec:
          display:
            name: Container restarts · last hour
            description: Only positive increases are shown, with the affected resources. No rows means no increase was observed in this window.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                show: true
                values:
                - last
              thresholds:
                mode: absolute
                steps: []
              visual:
                connectNulls: false
              yAxis:
                format:
                  decimalPlaces: 0
                  unit: none
                show: true
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  alias: ${sre_series}
                  query: max by (sre_series) (label_join((max by (cluster_name,namespace,pod_name,container) (increase(kubernetes_state_container_restarts{cluster_name=~"${platform_cluster}",namespace=~"${platform_namespace}"}[1h])) > 0), "sre_series", " · ", "cluster_name", "namespace", "pod_name", "container"))
      availability:
        spec:
          display:
            name: Unavailable application replicas
            description: Expected replicas minus ready replicas, grouped by namespace. Short periods during an update can be normal.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: right
                show: true
                values: []
              thresholds:
                mode: absolute
                steps: []
              visual:
                connectNulls: false
              yAxis:
                format:
                  decimalPlaces: 0
                  unit: none
                show: true
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  alias: ${sre_series}
                  query: max by (sre_series) (label_replace((label_join((sum by (cluster_name,namespace) (kubernetes_state_deployment_replicas_unavailable{cluster_name=~"${platform_cluster}",namespace=~"${platform_namespace}"})), "sre_series", " · ", "cluster_name", "namespace")), "sre_series", "Deployment · $1", "sre_series", "(.*)"))
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  alias: ${sre_series}
                  query: max by (sre_series) (label_replace((label_join((sum by (cluster_name,namespace) (kubernetes_state_daemonset_daemons_unavailable{cluster_name=~"${platform_cluster}",namespace=~"${platform_namespace}"})), "sre_series", " · ", "cluster_name", "namespace")), "sre_series", "DaemonSet · $1", "sre_series", "(.*)"))
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  alias: ${sre_series}
                  query: max by (sre_series) (label_replace((label_join((clamp_min(sum by (cluster_name,namespace) (kubernetes_state_statefulset_replicas_desired{cluster_name=~"${platform_cluster}",namespace=~"${platform_namespace}"}) - sum by (cluster_name,namespace) (kubernetes_state_statefulset_replicas_ready{cluster_name=~"${platform_cluster}",namespace=~"${platform_namespace}"}), 0)), "sre_series", " · ", "cluster_name", "namespace")), "sre_series", "StatefulSet · $1", "sre_series", "(.*)"))
      filesystem:
        spec:
          display:
            name: Disk space used · % matching df
            description: 'Used space divided by used plus space available to applications. Reserved blocks are excluded from this denominator. Each mount is identified. Loop devices are excluded: OS images such as Harvester active.img do not represent growing application data.'
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                show: true
                values:
                - last
              thresholds:
                mode: absolute
                steps: []
              visual:
                connectNulls: false
              yAxis:
                format:
                  decimalPlaces: 2
                  unit: percentunit
                show: true
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  alias: ${sre_series}
                  query: max by (sre_series) (label_join((((max by (cluster_name,node,device,mountpoint,fstype) (node_filesystem_size_bytes{cluster_name=~"${platform_cluster}",job="sre-node",device!~"/dev/loop[0-9]+",fstype!~"tmpfs|overlay|squashfs",mountpoint!~"/var/lib/kubelet/.*"})) - (max by (cluster_name,node,device,mountpoint,fstype) (node_filesystem_free_bytes{cluster_name=~"${platform_cluster}",job="sre-node",device!~"/dev/loop[0-9]+",fstype!~"tmpfs|overlay|squashfs",mountpoint!~"/var/lib/kubelet/.*"}))) / clamp_min(((max by (cluster_name,node,device,mountpoint,fstype) (node_filesystem_size_bytes{cluster_name=~"${platform_cluster}",job="sre-node",device!~"/dev/loop[0-9]+",fstype!~"tmpfs|overlay|squashfs",mountpoint!~"/var/lib/kubelet/.*"})) - (max by (cluster_name,node,device,mountpoint,fstype) (node_filesystem_free_bytes{cluster_name=~"${platform_cluster}",job="sre-node",device!~"/dev/loop[0-9]+",fstype!~"tmpfs|overlay|squashfs",mountpoint!~"/var/lib/kubelet/.*"}))) + (max by (cluster_name,node,device,mountpoint,fstype)
                    (node_filesystem_avail_bytes{cluster_name=~"${platform_cluster}",job="sre-node",device!~"/dev/loop[0-9]+",fstype!~"tmpfs|overlay|squashfs",mountpoint!~"/var/lib/kubelet/.*"})), 1)), "sre_series", " · ", "cluster_name", "node", "mountpoint", "device"))
      nodeUsed:
        spec:
          display:
            name: Space used on each host filesystem
            description: 'Filesystem capacity minus free space. Includes the Harvester data disk and distinguishes partitions. Do not add repeated mounts of one device. Loop devices are excluded: OS images such as Harvester active.img do not represent growing application data.'
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                show: true
                values:
                - last
              thresholds:
                mode: absolute
                steps: []
              visual:
                connectNulls: false
              yAxis:
                format:
                  decimalPlaces: 2
                  unit: bytes(IEC)
                show: true
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  alias: ${sre_series}
                  query: max by (sre_series) (label_join(((max by (cluster_name,node,device,mountpoint,fstype) (node_filesystem_size_bytes{cluster_name=~"${platform_cluster}",job="sre-node",device!~"/dev/loop[0-9]+",fstype!~"tmpfs|overlay|squashfs",mountpoint!~"/var/lib/kubelet/.*"})) - (max by (cluster_name,node,device,mountpoint,fstype) (node_filesystem_free_bytes{cluster_name=~"${platform_cluster}",job="sre-node",device!~"/dev/loop[0-9]+",fstype!~"tmpfs|overlay|squashfs",mountpoint!~"/var/lib/kubelet/.*"}))), "sre_series", " · ", "cluster_name", "node", "mountpoint", "device"))
      nodeTotal:
        spec:
          display:
            name: Capacity of each host filesystem
            description: 'Formatted size of the identified mount. It can differ from raw device capacity or the size requested by a PVC. Loop devices are excluded: OS images such as Harvester active.img do not represent growing application data.'
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                show: true
                values:
                - last
              thresholds:
                mode: absolute
                steps: []
              visual:
                connectNulls: false
              yAxis:
                format:
                  decimalPlaces: 2
                  unit: bytes(IEC)
                show: true
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  alias: ${sre_series}
                  query: max by (sre_series) (label_join((max by (cluster_name,node,device,mountpoint,fstype) (node_filesystem_size_bytes{cluster_name=~"${platform_cluster}",job="sre-node",device!~"/dev/loop[0-9]+",fstype!~"tmpfs|overlay|squashfs",mountpoint!~"/var/lib/kubelet/.*"})), "sre_series", " · ", "cluster_name", "node", "mountpoint", "device"))
      inodeRisk:
        spec:
          display:
            name: File entries already used · % of inodes
            description: 'Inodes represent files. They can run out even when bytes remain free. This percentage is calculated only when the inode total is positive. Loop devices are excluded: OS images such as Harvester active.img do not represent growing application data.'
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                show: true
                values:
                - last
              thresholds:
                mode: absolute
                steps: []
              visual:
                connectNulls: false
              yAxis:
                format:
                  decimalPlaces: 2
                  unit: percentunit
                show: true
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  alias: ${sre_series}
                  query: max by (sre_series) (label_join((1 - max by (cluster_name,node,device,mountpoint,fstype) (node_filesystem_files_free{cluster_name=~"${platform_cluster}",job="sre-node",device!~"/dev/loop[0-9]+",fstype!~"tmpfs|overlay|squashfs",mountpoint!~"/var/lib/kubelet/.*"}) / (max by (cluster_name,node,device,mountpoint,fstype) (node_filesystem_files{cluster_name=~"${platform_cluster}",job="sre-node",device!~"/dev/loop[0-9]+",fstype!~"tmpfs|overlay|squashfs",mountpoint!~"/var/lib/kubelet/.*"}) > 0)), "sre_series", " · ", "cluster_name", "node", "mountpoint", "device"))
      pvcRisk:
        spec:
          display:
            name: Measured PVC filesystems · space used in %
            description: Only PVCs with positive inode statistics are included. Block and unmounted volumes are not treated as full.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                show: true
                values:
                - last
              thresholds:
                mode: absolute
                steps: []
              visual:
                connectNulls: false
              yAxis:
                format:
                  decimalPlaces: 2
                  unit: percentunit
                show: true
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  alias: ${sre_series}
                  query: max by (sre_series) (label_join(((max by (cluster_name,namespace,persistentvolumeclaim) (kubernetes_kubelet_volume_stats_used_bytes{cluster_name=~"${platform_cluster}",namespace=~"${platform_namespace}"}) and on (cluster_name,namespace,persistentvolumeclaim) (max by (cluster_name,namespace,persistentvolumeclaim) (kubernetes_kubelet_volume_stats_inodes{cluster_name=~"${platform_cluster}",namespace=~"${platform_namespace}"}) > 0)) / (max by (cluster_name,namespace,persistentvolumeclaim) (kubernetes_kubelet_volume_stats_capacity_bytes{cluster_name=~"${platform_cluster}",namespace=~"${platform_namespace}"}) and on (cluster_name,namespace,persistentvolumeclaim) (max by (cluster_name,namespace,persistentvolumeclaim) (kubernetes_kubelet_volume_stats_inodes{cluster_name=~"${platform_cluster}",namespace=~"${platform_namespace}"}) > 0))), "sre_series", " · ", "cluster_name", "namespace", "persistentvolumeclaim"))
      pvcUsed:
        spec:
          display:
            name: Space used in measured PVC filesystems
            description: Usage reported by the kubelet and storage driver. This is not Longhorn replica storage or the filesystem inside a VM backed by a Block PVC.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                show: true
                values:
                - last
              thresholds:
                mode: absolute
                steps: []
              visual:
                connectNulls: false
              yAxis:
                format:
                  decimalPlaces: 2
                  unit: bytes(IEC)
                show: true
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  alias: ${sre_series}
                  query: max by (sre_series) (label_join((max by (cluster_name,namespace,persistentvolumeclaim) (kubernetes_kubelet_volume_stats_used_bytes{cluster_name=~"${platform_cluster}",namespace=~"${platform_namespace}"}) and on (cluster_name,namespace,persistentvolumeclaim) (max by (cluster_name,namespace,persistentvolumeclaim) (kubernetes_kubelet_volume_stats_inodes{cluster_name=~"${platform_cluster}",namespace=~"${platform_namespace}"}) > 0)), "sre_series", " · ", "cluster_name", "namespace", "persistentvolumeclaim"))
      pvcCapacity:
        spec:
          display:
            name: Capacity of measured PVC filesystems
            description: Formatted capacity reported by the kubelet. Filesystem metadata can make it smaller than the requested PVC size.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                show: true
                values:
                - last
              thresholds:
                mode: absolute
                steps: []
              visual:
                connectNulls: false
              yAxis:
                format:
                  decimalPlaces: 2
                  unit: bytes(IEC)
                show: true
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  alias: ${sre_series}
                  query: max by (sre_series) (label_join((max by (cluster_name,namespace,persistentvolumeclaim) (kubernetes_kubelet_volume_stats_capacity_bytes{cluster_name=~"${platform_cluster}",namespace=~"${platform_namespace}"}) and on (cluster_name,namespace,persistentvolumeclaim) (max by (cluster_name,namespace,persistentvolumeclaim) (kubernetes_kubelet_volume_stats_inodes{cluster_name=~"${platform_cluster}",namespace=~"${platform_namespace}"}) > 0)), "sre_series", " · ", "cluster_name", "namespace", "persistentvolumeclaim"))
      pvcUnmeasured:
        spec:
          display:
            name: PVCs without filesystem usage measurements
            description: Collection inventory, including Block volumes and volumes without mounted-filesystem statistics. Missing data is not a usage percentage.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                show: true
                values: []
              thresholds:
                mode: absolute
                steps: []
              visual:
                connectNulls: false
              yAxis:
                format:
                  decimalPlaces: 0
                  unit: none
                show: false
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  alias: ${sre_series}
                  query: max by (sre_series) (label_join((label_join((max by (cluster_name,namespace,persistentvolumeclaim) (kubernetes_state_persistentvolumeclaim_request_storage{cluster_name=~"${platform_cluster}",namespace=~"${platform_namespace}"})) unless on (cluster_name,namespace,persistentvolumeclaim) (max by (cluster_name,namespace,persistentvolumeclaim) (kubernetes_kubelet_volume_stats_inodes{cluster_name=~"${platform_cluster}",namespace=~"${platform_namespace}"}) > 0), "item", " · ", "cluster_name", "namespace", "persistentvolumeclaim")), "sre_series", "", "item"))
      pvPhases:
        spec:
          display:
            name: Cluster storage volumes · PV status
            description: Bound means attached to a claim; Available means available for a claim; Released requires checking retention policy and data ownership. Released is not always a failure.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                show: true
                values: []
              thresholds:
                mode: absolute
                steps: []
              visual:
                connectNulls: false
              yAxis:
                format:
                  decimalPlaces: 0
                  unit: none
                show: false
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  alias: ${sre_series}
                  query: max by (sre_series) (label_join((label_join(max by (cluster_name,persistentvolume,phase,storageclass) (last_over_time(kubernetes_state_persistentvolume_by_phase{cluster_name=~"${platform_cluster}"}[5m] @ end()) == 1), "item", " · ", "cluster_name", "persistentvolume", "phase", "storageclass")), "sre_series", "", "item"))
      pvcPhases:
        spec:
          display:
            name: Storage requests · PVC status
            description: Namespace, claim name, phase, and storage class. Investigate claims that remain Pending.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                show: true
                values: []
              thresholds:
                mode: absolute
                steps: []
              visual:
                connectNulls: false
              yAxis:
                format:
                  decimalPlaces: 0
                  unit: none
                show: false
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  alias: ${sre_series}
                  query: max by (sre_series) (label_join((label_join(max by (cluster_name,namespace,persistentvolumeclaim,phase,storageclass) (last_over_time(kubernetes_state_persistentvolumeclaim_status{cluster_name=~"${platform_cluster}",namespace=~"${platform_namespace}"}[5m] @ end()) == 1), "item", " · ", "cluster_name", "namespace", "persistentvolumeclaim", "phase", "storageclass")), "sre_series", "", "item"))
      etcdLeader:
        spec:
          display:
            name: etcd can see a leader · 1 yes / 0 no
            description: Every member should recognize a leader. Zero needs investigation; no data means a valid sample is unavailable.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                show: true
                values:
                - last
              thresholds:
                mode: absolute
                steps: []
              visual:
                connectNulls: false
              yAxis:
                format:
                  decimalPlaces: 0
                  unit: none
                show: true
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  alias: ${sre_series}
                  query: max by (sre_series) (label_join((max by (cluster_name,node) (etcd_server_has_leader{cluster_name=~"${platform_cluster}",job="sre-etcd"})), "sre_series", " · ", "cluster_name", "node"))
      etcdLeaderChanges:
        spec:
          display:
            name: Leader changes seen by each etcd member · last hour
            description: Do not add the same election observed by multiple members. Repeated elections can indicate instability; restarts also affect the history.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                show: true
                values:
                - last
              thresholds:
                mode: absolute
                steps: []
              visual:
                connectNulls: false
              yAxis:
                format:
                  decimalPlaces: 0
                  unit: none
                show: true
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  alias: ${sre_series}
                  query: max by (sre_series) (label_join((max by (cluster_name,node) (increase(etcd_server_leader_changes_seen_total{cluster_name=~"${platform_cluster}",job="sre-etcd"}[1h]))), "sre_series", " · ", "cluster_name", "node"))
      etcdPending:
        spec:
          display:
            name: etcd operations waiting for agreement
            description: Proposals waiting for consensus. A growing queue can indicate slow disks, network problems, or difficulty reaching a majority of members.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                show: true
                values:
                - last
              thresholds:
                mode: absolute
                steps: []
              visual:
                connectNulls: false
              yAxis:
                format:
                  decimalPlaces: 0
                  unit: none
                show: true
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  alias: ${sre_series}
                  query: max by (sre_series) (label_join((max by (cluster_name,node) (etcd_server_proposals_pending{cluster_name=~"${platform_cluster}",job="sre-etcd"})), "sre_series", " · ", "cluster_name", "node"))
      etcdApplyLag:
        spec:
          display:
            name: etcd operations agreed but not yet applied
            description: Committed proposals minus applied proposals, per member. Sustained growth means the stored state is falling behind agreed changes.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                show: true
                values:
                - last
              thresholds:
                mode: absolute
                steps: []
              visual:
                connectNulls: false
              yAxis:
                format:
                  decimalPlaces: 0
                  unit: none
                show: true
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  alias: ${sre_series}
                  query: max by (sre_series) (label_join((clamp_min(max by (cluster_name,node) (etcd_server_proposals_committed_total{cluster_name=~"${platform_cluster}",job="sre-etcd"}) - max by (cluster_name,node) (etcd_server_proposals_applied_total{cluster_name=~"${platform_cluster}",job="sre-etcd"}), 0)), "sre_series", " · ", "cluster_name", "node"))
      etcdFailed:
        spec:
          display:
            name: Failed etcd operations · last 15 minutes
            description: Proposals that did not complete through consensus. Compare with elections, connectivity, and logs.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                show: true
                values:
                - last
              thresholds:
                mode: absolute
                steps: []
              visual:
                connectNulls: false
              yAxis:
                format:
                  decimalPlaces: 0
                  unit: none
                show: true
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  alias: ${sre_series}
                  query: max by (sre_series) (label_join((max by (cluster_name,node) (increase(etcd_server_proposals_failed_total{cluster_name=~"${platform_cluster}",job="sre-etcd"}[15m]))), "sre_series", " · ", "cluster_name", "node"))
      etcdWAL:
        spec:
          display:
            name: etcd write-ahead log write time · p99 in ms
            description: 99% of write-ahead log flushes completed within this time. Above 10 ms for five minutes is an initial investigation threshold.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                show: true
                values:
                - last
              thresholds:
                mode: absolute
                steps: []
              visual:
                connectNulls: false
              yAxis:
                format:
                  decimalPlaces: 2
                  unit: none
                show: true
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  alias: ${sre_series}
                  query: max by (sre_series) (label_join(((histogram_quantile(0.99, sum by (cluster_name,node,le) (rate(etcd_disk_wal_fsync_duration_seconds_bucket{cluster_name=~"${platform_cluster}",job="sre-etcd"}[5m])))) * 1000), "sre_series", " · ", "cluster_name", "node"))
      etcdCommit:
        spec:
          display:
            name: etcd database write time · p99 in ms
            description: 99% of database commits completed within this time. Above 25 ms for five minutes is an initial investigation threshold.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                show: true
                values:
                - last
              thresholds:
                mode: absolute
                steps: []
              visual:
                connectNulls: false
              yAxis:
                format:
                  decimalPlaces: 2
                  unit: none
                show: true
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  alias: ${sre_series}
                  query: max by (sre_series) (label_join(((histogram_quantile(0.99, sum by (cluster_name,node,le) (rate(etcd_disk_backend_commit_duration_seconds_bucket{cluster_name=~"${platform_cluster}",job="sre-etcd"}[5m])))) * 1000), "sre_series", " · ", "cluster_name", "node"))
      etcdDB:
        spec:
          display:
            name: etcd database quota already used · %
            description: Physical database size divided by its quota. Near 100% risks blocking new writes. The initial monitor warns above 80% for ten minutes.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                show: true
                values:
                - last
              thresholds:
                mode: absolute
                steps: []
              visual:
                connectNulls: false
              yAxis:
                format:
                  decimalPlaces: 2
                  unit: percentunit
                show: true
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  alias: ${sre_series}
                  query: max by (sre_series) (label_join((max by (cluster_name,node) (etcd_mvcc_db_total_size_in_bytes{cluster_name=~"${platform_cluster}",job="sre-etcd"}) / max by (cluster_name,node) (etcd_server_quota_backend_bytes{cluster_name=~"${platform_cluster}",job="sre-etcd"})), "sre_series", " · ", "cluster_name", "node"))
      etcdScrape:
        spec:
          display:
            name: etcd metrics collection · 1 working / 0 failed
            description: Shows whether each metrics endpoint answered the collector. This does not prove healthy consensus. Also check leadership and expected member count.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                show: true
                values:
                - last
              thresholds:
                mode: absolute
                steps: []
              visual:
                connectNulls: false
              yAxis:
                format:
                  decimalPlaces: 0
                  unit: none
                show: true
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  alias: ${sre_series}
                  query: max by (sre_series) (label_join((min by (cluster_name,node) (up{cluster_name=~"${platform_cluster}",job="sre-etcd"})), "sre_series", " · ", "cluster_name", "node"))
      etcdPeer:
        spec:
          display:
            name: Network round trip between etcd members · p99 in ms
            description: Time to contact another member and receive a response. A single-member cluster has no peers, so this chart does not apply. Too few observations can also leave it empty.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                show: true
                values:
                - last
              thresholds:
                mode: absolute
                steps: []
              visual:
                connectNulls: false
              yAxis:
                format:
                  decimalPlaces: 2
                  unit: none
                show: true
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  alias: ${sre_series}
                  query: max by (sre_series) (label_join((label_join((label_join(((histogram_quantile(0.99, sum by (cluster_name,node,To,le) (rate(etcd_network_peer_round_trip_time_seconds_bucket{cluster_name=~"${platform_cluster}",job="sre-etcd"}[5m])))) * 1000), "sre_series", "", "cluster_name")), "sre_series", " · ", "sre_series", "node")), "sre_series", " → ", "sre_series", "To"))
      hostCPU:
        spec:
          display:
            name: CPU busy on each server · %
            description: Average utilization across logical processors. Compare sustained high values with CPU limits and slow applications.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                show: true
                values:
                - last
              thresholds:
                mode: absolute
                steps: []
              visual:
                connectNulls: false
              yAxis:
                format:
                  decimalPlaces: 2
                  unit: percentunit
                show: true
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  alias: ${sre_series}
                  query: max by (sre_series) (label_join((1 - avg by (cluster_name,node) (rate(node_cpu_seconds_total{cluster_name=~"${platform_cluster}",job="sre-node",mode="idle"}[5m]))), "sre_series", " · ", "cluster_name", "node"))
      hostMemory:
        spec:
          display:
            name: Memory still available on each server · %
            description: Linux MemAvailable divided by MemTotal. Lower values mean less headroom. Kubernetes requests are not used in this calculation.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                show: true
                values:
                - last
              thresholds:
                mode: absolute
                steps: []
              visual:
                connectNulls: false
              yAxis:
                format:
                  decimalPlaces: 2
                  unit: percentunit
                show: true
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  alias: ${sre_series}
                  query: max by (sre_series) (label_join((max by (cluster_name,node) (node_memory_MemAvailable_bytes{cluster_name=~"${platform_cluster}",job="sre-node"}) / max by (cluster_name,node) (node_memory_MemTotal_bytes{cluster_name=~"${platform_cluster}",job="sre-node"})), "sre_series", " · ", "cluster_name", "node"))
      ioPressure:
        spec:
          display:
            name: Time tasks wait for disk or I/O · %
            description: Linux PSI measures time when at least one task waits for I/O. Requires kernel support; unsupported nodes have no series.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                show: true
                values:
                - last
              thresholds:
                mode: absolute
                steps: []
              visual:
                connectNulls: false
              yAxis:
                format:
                  decimalPlaces: 2
                  unit: percentunit
                show: true
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  alias: ${sre_series}
                  query: max by (sre_series) (label_join((max by (cluster_name,node) (rate(node_pressure_io_waiting_seconds_total{cluster_name=~"${platform_cluster}",job="sre-node"}[5m]))), "sre_series", " · ", "cluster_name", "node"))
      memoryPressure:
        spec:
          display:
            name: Time tasks stall because of memory pressure · %
            description: Linux PSI measures tasks stalled by memory pressure. It can reveal contention before an out-of-memory termination.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                show: true
                values:
                - last
              thresholds:
                mode: absolute
                steps: []
              visual:
                connectNulls: false
              yAxis:
                format:
                  decimalPlaces: 2
                  unit: percentunit
                show: true
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  alias: ${sre_series}
                  query: max by (sre_series) (label_join((max by (cluster_name,node) (rate(node_pressure_memory_waiting_seconds_total{cluster_name=~"${platform_cluster}",job="sre-node"}[5m]))), "sre_series", " · ", "cluster_name", "node"))
      cpuGauge:
        spec:
          display:
            name: Server CPU busy · highest · %
            description: Shows the highest value among the selected resources at the end of the time window. The resource is named below. Orange starts at 80%, red at 90%; these are initial reference colors, not proof of an outage. See the historical charts for duration and trend. Five-minute CPU utilization averaged across the server logical processors. Namespace does not filter servers.
          plugin:
            kind: GaugeChart
            spec:
              calculation: last
              format:
                unit: percentunit
                decimalPlaces: 1
              max: 1
              thresholds:
                mode: absolute
                defaultColor: '#2E8540'
                steps:
                - color: '#E69F00'
                  value: 0.8
                - color: '#D32F2F'
                  value: 0.9
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  alias: ${sre_series}
                  query: max by (sre_series) (label_join((last_over_time((topk(1, (1 - avg by (cluster_name,node) (rate(node_cpu_seconds_total{cluster_name=~"${platform_cluster}",job="sre-node",mode="idle"}[5m])))))[1s:1s] @ end())), "sre_series", " · ", "cluster_name", "node"))
      memoryGauge:
        spec:
          display:
            name: Server memory used · highest · %
            description: Shows the highest value among the selected resources at the end of the time window. The resource is named below. Orange starts at 80%, red at 90%; these are initial reference colors, not proof of an outage. See the historical charts for duration and trend. Linux total minus available memory, divided by total. Reclaimable cache is accounted for in available memory. Namespace does not filter servers.
          plugin:
            kind: GaugeChart
            spec:
              calculation: last
              format:
                unit: percentunit
                decimalPlaces: 1
              max: 1
              thresholds:
                mode: absolute
                defaultColor: '#2E8540'
                steps:
                - color: '#E69F00'
                  value: 0.8
                - color: '#D32F2F'
                  value: 0.9
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  alias: ${sre_series}
                  query: max by (sre_series) (label_join((last_over_time((topk(1, (1 - (max by (cluster_name,node) (last_over_time(node_memory_MemAvailable_bytes{cluster_name=~"${platform_cluster}",job="sre-node"}[5m])) / max by (cluster_name,node) (last_over_time(node_memory_MemTotal_bytes{cluster_name=~"${platform_cluster}",job="sre-node"}[5m]))))))[1s:1s] @ end())), "sre_series", " · ", "cluster_name", "node"))
      diskGauge:
        spec:
          display:
            name: Host filesystem used · highest · %
            description: 'Shows the highest value among the selected resources at the end of the time window. The resource is named below. Orange starts at 80%, red at 90%; these are initial reference colors, not proof of an outage. See the historical charts for duration and trend. Used space divided by used plus space available to applications, matching df. The mount and device identify the filesystem. Namespace does not filter host disks. Loop devices are excluded: OS images such as Harvester active.img do not represent growing application data.'
          plugin:
            kind: GaugeChart
            spec:
              calculation: last
              format:
                unit: percentunit
                decimalPlaces: 1
              max: 1
              thresholds:
                mode: absolute
                defaultColor: '#2E8540'
                steps:
                - color: '#E69F00'
                  value: 0.8
                - color: '#D32F2F'
                  value: 0.9
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  alias: ${sre_series}
                  query: max by (sre_series) (label_join((last_over_time((topk(1, (((max by (cluster_name,node,device,mountpoint,fstype) (last_over_time(node_filesystem_size_bytes{cluster_name=~"${platform_cluster}",job="sre-node",device!~"/dev/loop[0-9]+",fstype!~"tmpfs|overlay|squashfs",mountpoint!~"/var/lib/kubelet/.*"}[5m]))) - (max by (cluster_name,node,device,mountpoint,fstype) (last_over_time(node_filesystem_free_bytes{cluster_name=~"${platform_cluster}",job="sre-node",device!~"/dev/loop[0-9]+",fstype!~"tmpfs|overlay|squashfs",mountpoint!~"/var/lib/kubelet/.*"}[5m])))) / clamp_min(((max by (cluster_name,node,device,mountpoint,fstype) (last_over_time(node_filesystem_size_bytes{cluster_name=~"${platform_cluster}",job="sre-node",device!~"/dev/loop[0-9]+",fstype!~"tmpfs|overlay|squashfs",mountpoint!~"/var/lib/kubelet/.*"}[5m]))) - (max by (cluster_name,node,device,mountpoint,fstype) (last_over_time(node_filesystem_free_bytes{cluster_name=~"${platform_cluster}",job="sre-node",device!~"/dev/loop[0-9]+",fstype!~"tmpfs|overlay|squashfs",mountpoint!~"/var/lib/kubelet/.*"}[5m]))))
                    + (max by (cluster_name,node,device,mountpoint,fstype) (last_over_time(node_filesystem_avail_bytes{cluster_name=~"${platform_cluster}",job="sre-node",device!~"/dev/loop[0-9]+",fstype!~"tmpfs|overlay|squashfs",mountpoint!~"/var/lib/kubelet/.*"}[5m]))), 1))))[1s:1s] @ end())), "sre_series", " · ", "cluster_name", "node", "mountpoint", "device"))
      networkErrors:
        spec:
          display:
            name: Network errors by interface · packets per second
            description: Receive plus transmit errors. Interface names help distinguish physical and virtual networks.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                show: true
                values:
                - last
              thresholds:
                mode: absolute
                steps: []
              visual:
                connectNulls: false
              yAxis:
                format:
                  decimalPlaces: 3
                  unit: none
                show: true
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  alias: ${sre_series}
                  query: max by (sre_series) (label_join((sum by (cluster_name,node,device) (rate(node_network_receive_errs_total{cluster_name=~"${platform_cluster}",job="sre-node",device!="lo"}[5m]) + rate(node_network_transmit_errs_total{cluster_name=~"${platform_cluster}",job="sre-node",device!="lo"}[5m]))), "sre_series", " · ", "cluster_name", "node", "device"))
      etcdGuide:
        spec:
          display:
            name: How to read etcd health
            description: etcd stores Kubernetes state. Check leadership, disk writes, peer communication, and collection separately.
          plugin:
            kind: Markdown
            spec:
              text: '**etcd stores Kubernetes state.** A member is a server that keeps a copy. A working metrics endpoint and a recognized leader are separate checks. **Peer RTT applies only when other members exist**; no peer chart is expected on a single-member cluster. p99 means 99 out of 100 operations completed within the displayed time; lower is better. WAL flush time above 10 ms or database commit time above 25 ms for five minutes needs investigation. These are initial thresholds, not an SLA guarantee.'
          queries: []
      collectorQueue:
        spec:
          display:
            name: Metrics waiting to reach SUSE · bytes
            description: Small temporary peaks are normal. Persistent growth suggests a receiver or connection problem. If sending stops completely, this series also stops arriving.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                show: true
                values:
                - last
              thresholds:
                mode: absolute
                steps: []
              visual:
                connectNulls: false
              yAxis:
                format:
                  decimalPlaces: 2
                  unit: bytes(IEC)
                show: true
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  alias: ${sre_series}
                  query: max by (sre_series) (label_join((max by (cluster_name,node,collector_kind) (vmagent_remotewrite_pending_data_bytes{cluster_name=~"${platform_cluster}",job="sre-collector"})), "sre_series", " · ", "cluster_name", "node", "collector_kind"))
      collectorRetries:
        spec:
          display:
            name: Metric delivery retries · last 15 minutes
            description: Zero is expected in a stable period. Logs distinguish DNS, certificates, authentication, and HTTP 503 receiver failures.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                show: true
                values:
                - last
              thresholds:
                mode: absolute
                steps: []
              visual:
                connectNulls: false
              yAxis:
                format:
                  decimalPlaces: 0
                  unit: none
                show: true
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  alias: ${sre_series}
                  query: max by (sre_series) (label_join((max by (cluster_name,node,collector_kind) (increase(vmagent_remotewrite_retries_count_total{cluster_name=~"${platform_cluster}",job="sre-collector"}[15m]))), "sre_series", " · ", "cluster_name", "node", "collector_kind"))
    variables:
    - perseslistvariable:
        kind: ListVariable
        spec:
          name: platform_cluster
          display:
            name: Cluster
