        - x: 12
          y: 27
          width: 12
          height: 3
          content:
            $ref: '#/spec/panels/pvcPhases'
        - x: 0
          y: 30
          width: 12
          height: 3
          content:
            $ref: '#/spec/panels/hostCPU'
        - x: 12
          y: 30
          width: 12
          height: 3
          content:
            $ref: '#/spec/panels/hostMemory'
        - x: 0
          y: 33
          width: 12
          height: 3
          content:
            $ref: '#/spec/panels/ioPressure'
        - x: 12
          y: 33
          width: 12
          height: 3
          content:
            $ref: '#/spec/panels/memoryPressure'
        - x: 0
          y: 36
          width: 24
          height: 3
          content:
            $ref: '#/spec/panels/networkErrors'
        - x: 0
          y: 39
          width: 24
          height: 2
          content:
            $ref: '#/spec/panels/etcdGuide'
        - x: 0
          y: 41
          width: 12
          height: 3
          content:
            $ref: '#/spec/panels/etcdLeader'
        - x: 12
          y: 41
          width: 12
          height: 3
          content:
            $ref: '#/spec/panels/etcdScrape'
        - x: 0
          y: 44
          width: 12
          height: 3
          content:
            $ref: '#/spec/panels/etcdLeaderChanges'
        - x: 12
          y: 44
          width: 12
          height: 3
          content:
            $ref: '#/spec/panels/etcdFailed'
        - x: 0
          y: 47
          width: 12
          height: 3
          content:
            $ref: '#/spec/panels/etcdPending'
        - x: 12
