name: Kubernetes Platform Health
description: Platform availability, server capacity, storage, etcd, and collection health.
scope: publicDashboard
dashboard:
  metadata:
    project: '{"saveVariables":false}'
  spec:
    layouts:
    - kind: Grid
      spec:
        items:
        - x: 0
          y: 0
          width: 24
          height: 1
          content:
            $ref: '#/spec/panels/guide'
        - x: 0
          y: 1
          width: 8
          height: 2
          content:
            $ref: '#/spec/panels/ready'
        - x: 8
          y: 1
          width: 8
          height: 2
          content:
            $ref: '#/spec/panels/coverage'
        - x: 16
          y: 1
          width: 8
          height: 2
          content:
            $ref: '#/spec/panels/nonRunning'
        - x: 0
          y: 3
          width: 8
          height: 2
          content:
            $ref: '#/spec/panels/cpuGauge'
        - x: 8
          y: 3
          width: 8
          height: 2
          content:
            $ref: '#/spec/panels/memoryGauge'
        - x: 16
          y: 3
          width: 8
          height: 2
          content:
            $ref: '#/spec/panels/diskGauge'
        - x: 0
          y: 5
          width: 24
          height: 2
          content:
            $ref: '#/spec/panels/nonRunningList'
        - x: 0
          y: 7
          width: 12
          height: 3
          content:
            $ref: '#/spec/panels/availability'
        - x: 12
          y: 7
          width: 12
          height: 3
          content:
            $ref: '#/spec/panels/restarts'
        - x: 0
          y: 10
          width: 24
          height: 3
          content:
            $ref: '#/spec/panels/filesystem'
        - x: 0
          y: 13
          width: 12
          height: 3
          content:
            $ref: '#/spec/panels/nodeUsed'
        - x: 12
          y: 13
          width: 12
          height: 3
          content:
            $ref: '#/spec/panels/nodeTotal'
        - x: 0
          y: 16
          width: 24
          height: 3
          content:
            $ref: '#/spec/panels/inodeRisk'
        - x: 0
          y: 19
          width: 12
          height: 3
          content:
            $ref: '#/spec/panels/pvcRisk'
        - x: 12
          y: 19
          width: 12
          height: 3
          content:
            $ref: '#/spec/panels/pvcUsed'
        - x: 0
          y: 22
          width: 24
          height: 3
          content:
            $ref: '#/spec/panels/pvcCapacity'
        - x: 0
          y: 25
          width: 24
          height: 2
          content:
            $ref: '#/spec/panels/pvcUnmeasured'
        - x: 0
          y: 27
          width: 12
          height: 3
          content:
