name: Dashboard - Instrumented apps
description: Application traffic, failed responses, and response time measured inside the application.
scope: publicDashboard
dashboard:
  metadata:
    project: '{"saveVariables":false}'
  spec:
    layouts:
    - kind: Grid
      spec:
        items:
        - x: 0
          y: 0
          width: 24
          height: 1
          content:
            $ref: '#/spec/panels/guide'
        - x: 0
          y: 1
          width: 12
          height: 2
          content:
            $ref: '#/spec/panels/rps'
        - x: 12
          y: 1
          width: 12
          height: 2
          content:
            $ref: '#/spec/panels/requests1h'
        - x: 0
          y: 3
          width: 12
          height: 2
          content:
            $ref: '#/spec/panels/requests24h'
        - x: 12
          y: 3
          width: 12
          height: 2
          content:
            $ref: '#/spec/panels/p95_1h'
        - x: 0
          y: 5
          width: 12
          height: 2
          content:
            $ref: '#/spec/panels/success'
        - x: 12
          y: 5
          width: 12
          height: 2
          content:
            $ref: '#/spec/panels/error5xx'
        - x: 0
          y: 7
          width: 24
          height: 2
          content:
            $ref: '#/spec/panels/routeTotals'
        - x: 0
          y: 9
          width: 24
          height: 3
          content:
            $ref: '#/spec/panels/slowServices'
        - x: 0
          y: 12
          width: 12
          height: 3
          content:
            $ref: '#/spec/panels/throughput'
        - x: 12
          y: 12
          width: 12
          height: 3
          content:
            $ref: '#/spec/panels/outcomes'
        - x: 0
          y: 15
          width: 12
          height: 3
          content:
            $ref: '#/spec/panels/errorRoutes'
        - x: 12
          y: 15
          width: 12
          height: 3
          content:
            $ref: '#/spec/panels/latency'
        - x: 0
          y: 18
          width: 24
          height: 3
          content:
            $ref: '#/spec/panels/errorTotals'
    panels:
      guide:
        spec:
          display:
            name: How to read this dashboard
            description: Traffic and timing measured inside the application. Proxy traffic is shown separately in Traefik Ingress Health.
          plugin:
            kind: Markdown
            spec:
              text: '**Start with failed responses and response time.** Requests are calls to an application, not people. Totals cover the previous hour or 24 hours and move with time. They are rounded estimates from metric samples, displayed with all digits; collection gaps can leave a period incomplete. Health and metrics routes are excluded. **p95 means 95 out of 100 calls finished within the displayed time. 1000 ms = 1 second.** Applications appear only when they publish the compatible metrics used by this dashboard. **Investigating errors:** use the route/code table and the time chart, then check logs or traces for that period. Metrics do not contain each request or its root cause.'
          queries: []
      rps:
        spec:
          display:
            name: Requests per second · average over the last hour
            description: Requests observed in the last hour divided by 3600. This is not the number of simultaneous users.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                decimalPlaces: 2
                unit: reqps
              sparkline: false
              valueFontSize: 40
              thresholds:
                defaultColor: '#1976B9'
                steps: []
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  alias: Requests/s
                  query: last_over_time(((sum(increase(http_server_requests_total{cluster_name=~"${app_cluster}",service_name=~"${instrumented_service}",http_route!~"(?i).*(health|ready|live|metrics).*"}[1h])) / 3600))[1s:1s] @ end())
      requests1h:
        spec:
          display:
            name: Completed requests · last hour
            description: Estimated completed calls in a moving one-hour window. Health and metrics routes are excluded.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                decimalPlaces: 0
                unit: none
              sparkline: false
              valueFontSize: 40
              thresholds:
                defaultColor: '#1976B9'
                steps: []
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  alias: Requests
                  query: last_over_time((round(sum(increase(http_server_requests_total{cluster_name=~"${app_cluster}",service_name=~"${instrumented_service}",http_route!~"(?i).*(health|ready|live|metrics).*"}[1h])), 1))[1s:1s] @ end())
      requests24h:
        spec:
          display:
            name: Completed requests · last 24 hours
            description: Observed calls within a moving 24-hour window. A full-day interpretation requires complete collection history.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                decimalPlaces: 0
                unit: none
              sparkline: false
              valueFontSize: 40
              thresholds:
                defaultColor: '#2E8540'
                steps: []
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  alias: Requests
                  query: last_over_time((round(sum(increase(http_server_requests_total{cluster_name=~"${app_cluster}",service_name=~"${instrumented_service}",http_route!~"(?i).*(health|ready|live|metrics).*"}[24h])), 1))[1s:1s] @ end())
      success:
        spec:
          display:
            name: Successful responses · last hour · %
            description: Share of responses with HTTP status 2xx or 3xx. Without traffic, this percentage does not apply. The initial green reference is 99%; use your service target.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                decimalPlaces: 2
                unit: percentunit
              sparkline: false
              valueFontSize: 40
              thresholds:
                defaultColor: '#D32F2F'
                steps:
                - color: '#E69F00'
                  value: 0.95
                - color: '#2E8540'
                  value: 0.99
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  alias: Success
                  query: last_over_time((((sum(increase(http_server_requests_total{cluster_name=~"${app_cluster}",service_name=~"${instrumented_service}",http_route!~"(?i).*(health|ready|live|metrics).*",status_class=~"2xx|3xx"}[1h])) or (sum(increase(http_server_requests_total{cluster_name=~"${app_cluster}",service_name=~"${instrumented_service}",http_route!~"(?i).*(health|ready|live|metrics).*"}[1h])) * 0)) / (sum(increase(http_server_requests_total{cluster_name=~"${app_cluster}",service_name=~"${instrumented_service}",http_route!~"(?i).*(health|ready|live|metrics).*"}[1h])) > 0)))[1s:1s] @ end())
      error5xx:
        spec:
          display:
            name: Server error responses · last hour · %
            description: Share of HTTP 5xx responses. Initial color references are 1% for warning and 5% for critical; adapt them to the service target.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                decimalPlaces: 2
                unit: percentunit
              sparkline: false
              valueFontSize: 40
              thresholds:
                defaultColor: '#2E8540'
                steps:
                - color: '#E69F00'
                  value: 0.01
                - color: '#D32F2F'
                  value: 0.05
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  alias: 5xx
                  query: last_over_time((((sum(increase(http_server_requests_total{cluster_name=~"${app_cluster}",service_name=~"${instrumented_service}",http_route!~"(?i).*(health|ready|live|metrics).*",status_class="5xx"}[1h])) or (sum(increase(http_server_requests_total{cluster_name=~"${app_cluster}",service_name=~"${instrumented_service}",http_route!~"(?i).*(health|ready|live|metrics).*"}[1h])) * 0)) / (sum(increase(http_server_requests_total{cluster_name=~"${app_cluster}",service_name=~"${instrumented_service}",http_route!~"(?i).*(health|ready|live|metrics).*"}[1h])) > 0)))[1s:1s] @ end())
      p95_1h:
        spec:
          display:
            name: Response time for 95% of calls · ms
            description: 95 out of 100 calls observed in the last hour finished within this time. Lower is better.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                decimalPlaces: 2
                unit: none
              sparkline: false
              valueFontSize: 40
              thresholds:
                defaultColor: '#2E8540'
                steps:
                - color: '#E69F00'
                  value: 500.0
                - color: '#D32F2F'
                  value: 1000.0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  alias: 95 of 100 calls (p95)
                  query: (last_over_time((histogram_quantile(0.95, sum by (le) (increase(http_server_request_duration_seconds_bucket{cluster_name=~"${app_cluster}",service_name=~"${instrumented_service}",http_route!~"(?i).*(health|ready|live|metrics).*"}[1h]))))[1s:1s] @ end())) * 1000
      throughput:
        spec:
          display:
            name: Requests per second by route
            description: A route is an application endpoint. This chart shows which functions receive the most calls.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: right
                show: true
                values: []
              thresholds:
                mode: absolute
                steps: []
              visual:
                connectNulls: false
              yAxis:
                format:
                  decimalPlaces: 2
                  unit: reqps
                show: true
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  alias: ${sre_series}
                  query: max by (sre_series) (label_join((sum by (cluster_name,service_name,http_route) (rate(http_server_requests_total{cluster_name=~"${app_cluster}",service_name=~"${instrumented_service}",http_route!~"(?i).*(health|ready|live|metrics).*"}[5m]))), "sre_series", " · ", "cluster_name", "service_name", "http_route"))
      outcomes:
        spec:
          display:
            name: Response types over time
            description: 2xx means success; 3xx means redirection; 4xx needs client or authentication context; 5xx means a server error.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: right
                show: true
                values: []
              thresholds:
                mode: absolute
                steps: []
              visual:
                connectNulls: false
              yAxis:
                format:
                  decimalPlaces: 2
                  unit: reqps
                show: true
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  alias: ${sre_series}
                  query: max by (sre_series) (label_join((sum by (status_class) (rate(http_server_requests_total{cluster_name=~"${app_cluster}",service_name=~"${instrumented_service}",http_route!~"(?i).*(health|ready|live|metrics).*"}[5m]))), "sre_series", "", "status_class"))
      errorRoutes:
        spec:
          display:
            name: When and where HTTP errors occurred · requests/s
            description: Find the application, normalized route and exact HTTP code. Each point averages five minutes. 400/404 can be invalid client input or an unknown path; 500/503 can come from the application or its dependencies. These are possibilities, not a diagnosis. Use logs or traces for the exact event and cause.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: right
                show: true
                values: []
              thresholds:
                mode: absolute
                steps: []
              visual:
                connectNulls: false
              yAxis:
                format:
                  decimalPlaces: 3
                  unit: reqps
                show: true
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  alias: ${sre_series}
                  query: max by (sre_series) (label_join((label_join((label_join((label_join((sum by (cluster_name,service_name,http_route,http_response_status_code) (rate(http_server_requests_total{cluster_name=~"${app_cluster}",service_name=~"${instrumented_service}",http_route!~"(?i).*(health|ready|live|metrics).*",status_class=~"4xx|5xx"}[5m]))), "sre_series", "", "cluster_name")), "sre_series", " · ", "sre_series", "service_name")), "sre_series", " · ", "sre_series", "http_route")), "sre_series", " · HTTP ", "sre_series", "http_response_status_code"))
      errorTotals:
        spec:
          display:
            name: HTTP errors by application, route and code · last hour
            description: One row per application, normalized route, method and HTTP status. Counts are rounded estimates from collected counters. A 400 is a rejected request; a 500 is an internal server failure. The reason needs request context from logs or traces. Without a recorded error series, this chart has no data.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                show: true
                values:
                - last
              thresholds:
                mode: absolute
                steps: []
              visual:
                connectNulls: false
              yAxis:
                format:
                  decimalPlaces: 0
                  unit: none
                show: true
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  alias: ${sre_series}
                  query: max by (sre_series) (label_join((label_join((label_join((label_join((label_join((round(sum by (cluster_name,service_name,http_route,http_request_method,http_response_status_code) (increase(http_server_requests_total{cluster_name=~"${app_cluster}",service_name=~"${instrumented_service}",http_route!~"(?i).*(health|ready|live|metrics).*",status_class=~"4xx|5xx"}[1h] @ end())), 1)), "sre_series", "", "cluster_name")), "sre_series", " · ", "sre_series", "service_name")), "sre_series", " · ", "sre_series", "http_request_method")), "sre_series", " ", "sre_series", "http_route")), "sre_series", " · HTTP ", "sre_series", "http_response_status_code"))
      latency:
        spec:
          display:
            name: Response time over time · ms
            description: p50 covers half the calls, p95 covers 95%, and p99 covers 99%. Without completed calls, no response time can be calculated.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: right
                show: true
                values: []
              thresholds:
                mode: absolute
                steps: []
              visual:
                connectNulls: false
              yAxis:
                format:
                  decimalPlaces: 2
                  unit: none
                show: true
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  alias: Half of calls (p50)
                  query: (histogram_quantile(0.50, sum by (le) (rate(http_server_request_duration_seconds_bucket{cluster_name=~"${app_cluster}",service_name=~"${instrumented_service}",http_route!~"(?i).*(health|ready|live|metrics).*"}[5m])))) * 1000
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  alias: 95 of 100 calls (p95)
                  query: (histogram_quantile(0.95, sum by (le) (rate(http_server_request_duration_seconds_bucket{cluster_name=~"${app_cluster}",service_name=~"${instrumented_service}",http_route!~"(?i).*(health|ready|live|metrics).*"}[5m])))) * 1000
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  alias: 99 of 100 calls (p99)
                  query: (histogram_quantile(0.99, sum by (le) (rate(http_server_request_duration_seconds_bucket{cluster_name=~"${app_cluster}",service_name=~"${instrumented_service}",http_route!~"(?i).*(health|ready|live|metrics).*"}[5m])))) * 1000
      routeTotals:
        spec:
          display:
            name: Requests by route · last hour
            description: One row per application and route. Values are rounded to whole requests and do not count unique users.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                show: true
                values:
                - last
              thresholds:
                mode: absolute
                steps: []
              visual:
                connectNulls: false
              yAxis:
                format:
                  decimalPlaces: 0
                  unit: none
                show: true
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  alias: ${sre_series}
                  query: max by (sre_series) (label_join((round(sum by (cluster_name,service_name,http_route) (increase(http_server_requests_total{cluster_name=~"${app_cluster}",service_name=~"${instrumented_service}",http_route!~"(?i).*(health|ready|live|metrics).*"}[1h] @ end())), 1)), "sre_series", " · ", "cluster_name", "service_name", "http_route"))
      slowServices:
        spec:
          display:
            name: Slowest applications · p95 response time in ms
            description: Compare the time taken by 95% of calls in the last hour. Investigate the slowest application together with its errors.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                show: true
                values:
                - last
              thresholds:
                mode: absolute
                steps: []
              visual:
                connectNulls: false
              yAxis:
                format:
                  decimalPlaces: 2
                  unit: none
                show: true
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  alias: ${sre_series}
                  query: max by (sre_series) (label_join(((topk(10, histogram_quantile(0.95, sum by (cluster_name,service_name,le) (increase(http_server_request_duration_seconds_bucket{cluster_name=~"${app_cluster}",service_name=~"${instrumented_service}",http_route!~"(?i).*(health|ready|live|metrics).*"}[1h]))))) * 1000), "sre_series", " · ", "cluster_name", "service_name"))
    variables:
    - perseslistvariable:
        kind: ListVariable
        spec:
          name: app_cluster
          display:
            name: Application cluster
            description: Select one or more values. After changing a parent filter, reset the following filters to Everything.
          allowAllValue: true
          allowMultiple: true
          customAllValue: .*
          sort: alphabetical-asc
          defaultValue:
            perseslistvariabledefaultsinglevalue:
              kind: singleValue
              singleValue: '{"type":"Everything"}'
            perseslistvariabledefaultslicevalues: null
          plugin:
            kind: MetricLabelValues
            spec:
              labelName: cluster_name
              matchers:
              - '{__name__=~"http_server_requests_total|http_server_active_requests"}'
      persestextvariable: null
    - perseslistvariable:
        kind: ListVariable
        spec:
          name: instrumented_service
          display:
            name: Instrumented application
            description: Select one or more values. After changing a parent filter, reset the following filters to Everything.
          allowAllValue: true
          allowMultiple: true
          customAllValue: .*
          sort: alphabetical-asc
          defaultValue:
            perseslistvariabledefaultsinglevalue:
              kind: singleValue
              singleValue: '{"type":"Everything"}'
            perseslistvariabledefaultslicevalues: null
          plugin:
            kind: MetricLabelValues
            spec:
              labelName: service_name
              matchers:
              - '{__name__=~"http_server_requests_total|http_server_active_requests",cluster_name=~"${app_cluster}"}'
      persestextvariable: null
