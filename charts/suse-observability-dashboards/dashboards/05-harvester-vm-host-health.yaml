name: Harvester VM & Host Health
description: Memory and CPU inside VMs, configured VM resources, and Harvester host consumption.
scope: publicDashboard
dashboard:
  metadata:
    project: '{"saveVariables":false}'
  spec:
    layouts:
    - kind: Grid
      spec:
        items:
        - x: 0
          y: 0
          width: 24
          height: 1
          content:
            $ref: '#/spec/panels/guide'
        - x: 0
          y: 1
          width: 8
          height: 2
          content:
            $ref: '#/spec/panels/guestCpuGauge'
        - x: 8
          y: 1
          width: 8
          height: 2
          content:
            $ref: '#/spec/panels/guestMemoryGauge'
        - x: 16
          y: 1
          width: 8
          height: 2
          content:
            $ref: '#/spec/panels/guestDiskGauge'
        - x: 0
          y: 3
          width: 12
          height: 2
          content:
            $ref: '#/spec/panels/hostCpuGauge'
        - x: 12
          y: 3
          width: 12
          height: 2
          content:
            $ref: '#/spec/panels/hostMemoryGauge'
        - x: 0
          y: 5
          width: 8
          height: 3
          content:
            $ref: '#/spec/panels/guestUsed'
        - x: 8
          y: 5
          width: 8
          height: 3
          content:
            $ref: '#/spec/panels/guestAvailable'
        - x: 16
          y: 5
          width: 8
          height: 3
          content:
            $ref: '#/spec/panels/guestTotal'
        - x: 0
          y: 8
          width: 8
          height: 3
          content:
            $ref: '#/spec/panels/domainRequest'
        - x: 8
          y: 8
          width: 8
          height: 3
          content:
            $ref: '#/spec/panels/domainLimit'
        - x: 16
          y: 8
          width: 8
          height: 3
          content:
            $ref: '#/spec/panels/configuredGuest'
        - x: 0
          y: 11
          width: 8
          height: 3
          content:
            $ref: '#/spec/panels/vcpuUse'
        - x: 8
          y: 11
          width: 8
          height: 3
          content:
            $ref: '#/spec/panels/vcpuRequest'
        - x: 16
          y: 11
          width: 8
          height: 3
          content:
            $ref: '#/spec/panels/vcpuLimit'
        - x: 0
          y: 14
          width: 12
          height: 3
          content:
            $ref: '#/spec/panels/resident'
        - x: 12
          y: 14
          width: 12
          height: 3
          content:
            $ref: '#/spec/panels/guestMissing'
        - x: 0
          y: 17
          width: 12
          height: 3
          content:
            $ref: '#/spec/panels/hostUsed'
        - x: 12
          y: 17
          width: 12
          height: 3
          content:
            $ref: '#/spec/panels/hostAvailable'
        - x: 0
          y: 20
          width: 12
          height: 3
          content:
            $ref: '#/spec/panels/hostRequests'
        - x: 12
          y: 20
          width: 12
          height: 3
          content:
            $ref: '#/spec/panels/hostLimits'
        - x: 0
          y: 23
          width: 24
          height: 3
          content:
            $ref: '#/spec/panels/guestDiskRatio'
        - x: 0
          y: 26
          width: 12
          height: 3
          content:
            $ref: '#/spec/panels/guestDiskUsed'
        - x: 12
          y: 26
          width: 12
          height: 3
          content:
            $ref: '#/spec/panels/guestDiskCapacity'
    panels:
      guide:
        spec:
          display:
            name: Understand the three measurement layers
            description: The OS inside a VM, the VM resource configuration, and consumption on the Harvester server.
          plugin:
            kind: Markdown
            spec:
              text: '**Inside the VM:** memory used is OS total minus OS available memory. **VM settings:** requests, limits, and configured guest memory are different values. **On the host:** the QEMU process also consumes memory to run the VM. **1000 mCPU = 1 vCPU; 1 GiB = 1024 MiB.** Guest memory needs balloon statistics; guest filesystems need QEMU Guest Agent. A stopped VM has no current consumption. Harvester host panels remain cluster-wide when a VM or namespace is selected. Circular gauges show the highest selected utilization, not the average across resources; orange starts at 80% and red at 90%. The named resource may change as utilization changes.'
          queries: []
      guestUsed:
        spec:
          display:
            name: Memory used inside the VM
            description: Guest OS total minus available memory, from KubeVirt balloon statistics. This differs from QEMU memory resident on the host.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                show: true
                values:
                - last
              thresholds:
                mode: absolute
                steps: []
              visual:
                connectNulls: false
              yAxis:
                format:
                  decimalPlaces: 2
                  unit: bytes(IEC)
                show: true
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  alias: ${sre_series}
                  query: max by (sre_series) (label_join((clamp_min((max by (k8s_cluster_name,namespace,name) (kubevirt_vmi_memory_available_bytes{k8s_cluster_name=~"${vm_cluster}",namespace=~"${vm_namespace}",name=~"${vm_name}"}) and on (k8s_cluster_name,namespace,name) (max by (k8s_cluster_name,namespace,name) (kubevirt_vmi_info{k8s_cluster_name=~"${vm_cluster}",namespace=~"${vm_namespace}",name=~"${vm_name}",phase="running"}))) - (max by (k8s_cluster_name,namespace,name) (kubevirt_vmi_memory_usable_bytes{k8s_cluster_name=~"${vm_cluster}",namespace=~"${vm_namespace}",name=~"${vm_name}"}) and on (k8s_cluster_name,namespace,name) (max by (k8s_cluster_name,namespace,name) (kubevirt_vmi_info{k8s_cluster_name=~"${vm_cluster}",namespace=~"${vm_namespace}",name=~"${vm_name}",phase="running"}))), 0)), "sre_series", " · ", "k8s_cluster_name", "namespace", "name"))
      guestAvailable:
        spec:
          display:
            name: Memory still available inside the VM
            description: Memory the guest expects to use without swapping. This comes from the KubeVirt usable_bytes metric.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                show: true
                values:
                - last
              thresholds:
                mode: absolute
                steps: []
              visual:
                connectNulls: false
              yAxis:
                format:
                  decimalPlaces: 2
                  unit: bytes(IEC)
                show: true
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  alias: ${sre_series}
                  query: max by (sre_series) (label_join((max by (k8s_cluster_name,namespace,name) (kubevirt_vmi_memory_usable_bytes{k8s_cluster_name=~"${vm_cluster}",namespace=~"${vm_namespace}",name=~"${vm_name}"}) and on (k8s_cluster_name,namespace,name) (max by (k8s_cluster_name,namespace,name) (kubevirt_vmi_info{k8s_cluster_name=~"${vm_cluster}",namespace=~"${vm_namespace}",name=~"${vm_name}",phase="running"}))), "sre_series", " · ", "k8s_cluster_name", "namespace", "name"))
      guestTotal:
        spec:
          display:
            name: Total memory seen by the VM operating system
            description: Total reported by the guest. Reserved regions can make it smaller than the configured guest memory.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                show: true
                values:
                - last
              thresholds:
                mode: absolute
                steps: []
              visual:
                connectNulls: false
              yAxis:
                format:
                  decimalPlaces: 2
                  unit: bytes(IEC)
                show: true
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  alias: ${sre_series}
                  query: max by (sre_series) (label_join((max by (k8s_cluster_name,namespace,name) (kubevirt_vmi_memory_available_bytes{k8s_cluster_name=~"${vm_cluster}",namespace=~"${vm_namespace}",name=~"${vm_name}"}) and on (k8s_cluster_name,namespace,name) (max by (k8s_cluster_name,namespace,name) (kubevirt_vmi_info{k8s_cluster_name=~"${vm_cluster}",namespace=~"${vm_namespace}",name=~"${vm_name}",phase="running"}))), "sre_series", " · ", "k8s_cluster_name", "namespace", "name"))
      domainRequest:
        spec:
          display:
            name: Memory requested by the VM
            description: The VM domain memory request is used for scheduling. It is not measured memory consumption.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                show: true
                values:
                - last
              thresholds:
                mode: absolute
                steps: []
              visual:
                connectNulls: false
              yAxis:
                format:
                  decimalPlaces: 2
                  unit: bytes(IEC)
                show: true
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  alias: ${sre_series}
                  query: max by (sre_series) (label_join((max by (k8s_cluster_name,namespace,name) (kubevirt_vm_resource_requests{k8s_cluster_name=~"${vm_cluster}",namespace=~"${vm_namespace}",name=~"${vm_name}",resource="memory",unit="bytes",source="domain"}) and on (k8s_cluster_name,namespace,name) (max by (k8s_cluster_name,namespace,name) (kubevirt_vmi_info{k8s_cluster_name=~"${vm_cluster}",namespace=~"${vm_namespace}",name=~"${vm_name}",phase="running"}))), "sre_series", " · ", "k8s_cluster_name", "namespace", "name"))
      domainLimit:
        spec:
          display:
            name: Configured VM memory limit
            description: The VM domain memory limit. It differs from the virt-launcher container limit, which can include overhead.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                show: true
                values:
                - last
              thresholds:
                mode: absolute
                steps: []
              visual:
                connectNulls: false
              yAxis:
                format:
                  decimalPlaces: 2
                  unit: bytes(IEC)
                show: true
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  alias: ${sre_series}
                  query: max by (sre_series) (label_join((max by (k8s_cluster_name,namespace,name) (kubevirt_vm_resource_limits{k8s_cluster_name=~"${vm_cluster}",namespace=~"${vm_namespace}",name=~"${vm_name}",resource="memory",unit="bytes"}) and on (k8s_cluster_name,namespace,name) (max by (k8s_cluster_name,namespace,name) (kubevirt_vmi_info{k8s_cluster_name=~"${vm_cluster}",namespace=~"${vm_namespace}",name=~"${vm_name}",phase="running"}))), "sre_series", " · ", "k8s_cluster_name", "namespace", "name"))
      configuredGuest:
        spec:
          display:
            name: Memory configured for the guest OS
            description: Memory assigned to the guest. It is not automatically the same as the scheduling request.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                show: true
                values:
                - last
              thresholds:
                mode: absolute
                steps: []
              visual:
                connectNulls: false
              yAxis:
                format:
                  decimalPlaces: 2
                  unit: bytes(IEC)
                show: true
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  alias: ${sre_series}
                  query: max by (sre_series) (label_join((max by (k8s_cluster_name,namespace,name) (kubevirt_vm_resource_requests{k8s_cluster_name=~"${vm_cluster}",namespace=~"${vm_namespace}",name=~"${vm_name}",resource="memory",unit="bytes",source="guest"}) and on (k8s_cluster_name,namespace,name) (max by (k8s_cluster_name,namespace,name) (kubevirt_vmi_info{k8s_cluster_name=~"${vm_cluster}",namespace=~"${vm_namespace}",name=~"${vm_name}",phase="running"}))), "sre_series", " · ", "k8s_cluster_name", "namespace", "name"))
      resident:
        spec:
          display:
            name: VM process memory on the host · QEMU
            description: Resident memory of the process running the VM. It does not directly measure application memory inside the guest.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                show: true
                values:
                - last
              thresholds:
                mode: absolute
                steps: []
              visual:
                connectNulls: false
              yAxis:
                format:
                  decimalPlaces: 2
                  unit: bytes(IEC)
                show: true
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  alias: ${sre_series}
                  query: max by (sre_series) (label_join((max by (k8s_cluster_name,namespace,name) (kubevirt_vmi_memory_resident_bytes{k8s_cluster_name=~"${vm_cluster}",namespace=~"${vm_namespace}",name=~"${vm_name}"}) and on (k8s_cluster_name,namespace,name) (max by (k8s_cluster_name,namespace,name) (kubevirt_vmi_info{k8s_cluster_name=~"${vm_cluster}",namespace=~"${vm_namespace}",name=~"${vm_name}",phase="running"}))), "sre_series", " · ", "k8s_cluster_name", "namespace", "name"))
      vcpuUse:
        spec:
          display:
            name: CPU used by the VM · vCPU cores
            description: Five-minute average. A value of 1 means one core used continuously; this value is not in millicores.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                show: true
                values:
                - last
              thresholds:
                mode: absolute
                steps: []
              visual:
                connectNulls: false
              yAxis:
                format:
                  decimalPlaces: 3
                  unit: none
                show: true
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  alias: ${sre_series}
                  query: max by (sre_series) (label_join((sum by (k8s_cluster_name,namespace,name) (rate(kubevirt_vmi_cpu_usage_seconds_total{k8s_cluster_name=~"${vm_cluster}",namespace=~"${vm_namespace}",name=~"${vm_name}"}[5m]))), "sre_series", " · ", "k8s_cluster_name", "namespace", "name"))
      vcpuRequest:
        spec:
          display:
            name: CPU requested by the VM · mCPU
            description: Scheduling reservation, not the number of configured virtual CPUs. For example, a VM can have four vCPUs and a request of 250 mCPU.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                show: true
                values:
                - last
              thresholds:
                mode: absolute
                steps: []
              visual:
                connectNulls: false
              yAxis:
                format:
                  decimalPlaces: 1
                  unit: none
                show: true
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  alias: ${sre_series}
                  query: max by (sre_series) (label_join(((max by (k8s_cluster_name,namespace,name) (kubevirt_vm_resource_requests{k8s_cluster_name=~"${vm_cluster}",namespace=~"${vm_namespace}",name=~"${vm_name}",resource="cpu",unit="cores",source="requests"}) and on (k8s_cluster_name,namespace,name) (max by (k8s_cluster_name,namespace,name) (kubevirt_vmi_info{k8s_cluster_name=~"${vm_cluster}",namespace=~"${vm_namespace}",name=~"${vm_name}",phase="running"}))) * 1000), "sre_series", " · ", "k8s_cluster_name", "namespace", "name"))
      vcpuLimit:
        spec:
          display:
            name: Configured VM CPU limit · vCPU cores
            description: Configured domain CPU ceiling. A missing series does not mean a zero limit.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                show: true
                values:
                - last
              thresholds:
                mode: absolute
                steps: []
              visual:
                connectNulls: false
              yAxis:
                format:
                  decimalPlaces: 2
                  unit: none
                show: true
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  alias: ${sre_series}
                  query: max by (sre_series) (label_join((max by (k8s_cluster_name,namespace,name) (kubevirt_vm_resource_limits{k8s_cluster_name=~"${vm_cluster}",namespace=~"${vm_namespace}",name=~"${vm_name}",resource="cpu",unit="cores"}) and on (k8s_cluster_name,namespace,name) (max by (k8s_cluster_name,namespace,name) (kubevirt_vmi_info{k8s_cluster_name=~"${vm_cluster}",namespace=~"${vm_namespace}",name=~"${vm_name}",phase="running"}))), "sre_series", " · ", "k8s_cluster_name", "namespace", "name"))
      hostUsed:
        spec:
          display:
            name: Memory used on Harvester hosts · whole cluster
            description: Linux total minus available memory. Includes VMs and host services. This is not the sum of Kubernetes requests.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                show: true
                values:
                - last
              thresholds:
                mode: absolute
                steps: []
              visual:
                connectNulls: false
              yAxis:
                format:
                  decimalPlaces: 2
                  unit: bytes(IEC)
                show: true
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  alias: ${sre_series}
                  query: max by (sre_series) (label_join(((max by (cluster_name,node) (node_memory_MemTotal_bytes{cluster_name=~"${vm_cluster}",job="sre-node"}) and on (cluster_name) (max by (cluster_name) (label_replace(up{service_name="kubevirt-metrics",k8s_cluster_name=~"${vm_cluster}"}, "cluster_name", "$1", "k8s_cluster_name", "(.*)") or label_replace(kubevirt_vmi_info{k8s_cluster_name=~"${vm_cluster}"}, "cluster_name", "$1", "k8s_cluster_name", "(.*)")))) - (max by (cluster_name,node) (node_memory_MemAvailable_bytes{cluster_name=~"${vm_cluster}",job="sre-node"}) and on (cluster_name) (max by (cluster_name) (label_replace(up{service_name="kubevirt-metrics",k8s_cluster_name=~"${vm_cluster}"}, "cluster_name", "$1", "k8s_cluster_name", "(.*)") or label_replace(kubevirt_vmi_info{k8s_cluster_name=~"${vm_cluster}"}, "cluster_name", "$1", "k8s_cluster_name", "(.*)"))))), "sre_series", " · ", "cluster_name", "node"))
      hostAvailable:
        spec:
          display:
            name: Memory available on Harvester hosts · whole cluster
            description: Memory the host considers available for use. VM and namespace filters do not apply.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                show: true
                values:
                - last
              thresholds:
                mode: absolute
                steps: []
              visual:
                connectNulls: false
              yAxis:
                format:
                  decimalPlaces: 2
                  unit: bytes(IEC)
                show: true
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  alias: ${sre_series}
                  query: max by (sre_series) (label_join((max by (cluster_name,node) (node_memory_MemAvailable_bytes{cluster_name=~"${vm_cluster}",job="sre-node"}) and on (cluster_name) (max by (cluster_name) (label_replace(up{service_name="kubevirt-metrics",k8s_cluster_name=~"${vm_cluster}"}, "cluster_name", "$1", "k8s_cluster_name", "(.*)") or label_replace(kubevirt_vmi_info{k8s_cluster_name=~"${vm_cluster}"}, "cluster_name", "$1", "k8s_cluster_name", "(.*)")))), "sre_series", " · ", "cluster_name", "node"))
      hostRequests:
        spec:
          display:
            name: Memory requested by Harvester pods · whole cluster
            description: Sum of requests for regular containers, including virt-launcher. Reserved capacity is not consumption and does not include every special scheduling rule.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                show: true
                values:
                - last
              thresholds:
                mode: absolute
                steps: []
              visual:
                connectNulls: false
              yAxis:
                format:
                  decimalPlaces: 2
                  unit: bytes(IEC)
                show: true
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  alias: ${sre_series}
                  query: max by (sre_series) (label_join((sum by (cluster_name) (kubernetes_state_container_memory_requested{cluster_name=~"${vm_cluster}"}) and on (cluster_name) (max by (cluster_name) (label_replace(up{service_name="kubevirt-metrics",k8s_cluster_name=~"${vm_cluster}"}, "cluster_name", "$1", "k8s_cluster_name", "(.*)") or label_replace(kubevirt_vmi_info{k8s_cluster_name=~"${vm_cluster}"}, "cluster_name", "$1", "k8s_cluster_name", "(.*)")))), "sre_series", "", "cluster_name"))
      hostLimits:
        spec:
          display:
            name: Sum of Harvester pod memory limits · whole cluster
            description: Sum of configured limits. Missing limits make this view partial; the sum can exceed physical memory.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                show: true
                values:
                - last
              thresholds:
                mode: absolute
                steps: []
              visual:
                connectNulls: false
              yAxis:
                format:
                  decimalPlaces: 2
                  unit: bytes(IEC)
                show: true
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  alias: ${sre_series}
                  query: max by (sre_series) (label_join((sum by (cluster_name) (kubernetes_state_container_memory_limit{cluster_name=~"${vm_cluster}"}) and on (cluster_name) (max by (cluster_name) (label_replace(up{service_name="kubevirt-metrics",k8s_cluster_name=~"${vm_cluster}"}, "cluster_name", "$1", "k8s_cluster_name", "(.*)") or label_replace(kubevirt_vmi_info{k8s_cluster_name=~"${vm_cluster}"}, "cluster_name", "$1", "k8s_cluster_name", "(.*)")))), "sre_series", "", "cluster_name"))
      guestMissing:
        spec:
          display:
            name: Running VMs without OS memory statistics
            description: Running VMs missing total or available memory measurements. Check balloon support. QEMU Guest Agent provides additional filesystem information.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                show: true
                values: []
              thresholds:
                mode: absolute
                steps: []
              visual:
                connectNulls: false
              yAxis:
                format:
                  decimalPlaces: 0
                  unit: none
                show: false
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  alias: ${sre_series}
                  query: max by (sre_series) (label_join(((label_join((max by (k8s_cluster_name,namespace,name) (kubevirt_vmi_info{k8s_cluster_name=~"${vm_cluster}",namespace=~"${vm_namespace}",name=~"${vm_name}",phase="running"})) unless on (k8s_cluster_name,namespace,name) ((max by (k8s_cluster_name,namespace,name) (kubevirt_vmi_memory_available_bytes{k8s_cluster_name=~"${vm_cluster}",namespace=~"${vm_namespace}",name=~"${vm_name}"}) and on (k8s_cluster_name,namespace,name) (max by (k8s_cluster_name,namespace,name) (kubevirt_vmi_info{k8s_cluster_name=~"${vm_cluster}",namespace=~"${vm_namespace}",name=~"${vm_name}",phase="running"}))) and on (k8s_cluster_name,namespace,name) (max by (k8s_cluster_name,namespace,name) (kubevirt_vmi_memory_usable_bytes{k8s_cluster_name=~"${vm_cluster}",namespace=~"${vm_namespace}",name=~"${vm_name}"}) and on (k8s_cluster_name,namespace,name) (max by (k8s_cluster_name,namespace,name) (kubevirt_vmi_info{k8s_cluster_name=~"${vm_cluster}",namespace=~"${vm_namespace}",name=~"${vm_name}",phase="running"})))),
                    "item", " · ", "k8s_cluster_name", "namespace", "name")) or on() label_replace(vector(0), "item", "No matching items; check filters and collection coverage", "", "")), "sre_series", "", "item"))
      guestDiskUsed:
