mode: all
clusterName: ''
observability:
  url: ''
  remoteWriteUrl: ''
  otlpEndpoint: ''
ingestion:
  existingSecret: suse-observability-agent-secrets
  secretKey: STS_API_KEY
auth:
  dashboards:
    existingSecret: suse-observability-publisher-token
    serviceTokenKey: serviceToken
  monitors:
    existingSecret: suse-observability-publisher-token
    serviceTokenKey: serviceToken
lifecycle:
  action: apply
  confirmDelete: ''
  deleteOnUninstall: true
  revision: '1'
slo:
  availabilityTarget: 99.9
content:
  publisher:
    image: python:3.12-alpine
    imagePullPolicy: IfNotPresent
    imagePullSecrets: []
    cli:
      path: ''
      downloadUrl: https://dl.stackstate.com/stackstate-cli/v3.3.6/stackstate-cli-3.3.6.linux-x86_64.tar.gz
      sha256: 12eb322d6670a677b21a29f645c929fb0f34d9009952deb95e7eb93cafbd8543
    caSecret: ''
    caKey: ca.crt
    activeDeadlineSeconds: 900
    ttlSecondsAfterFinished: 86400
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
        ephemeral-storage: 96Mi
      limits:
        cpu: 200m
        memory: 192Mi
        ephemeral-storage: 320Mi
    nodeSelector:
      kubernetes.io/os: linux
      kubernetes.io/arch: amd64
    tolerations: []
  dashboards:
    enabled: true
    include:
    - harvester
    - virtualization-contention
    - virtualization-capacity
    - virtualization-storage
    updateStrategy: replace
  monitors:
    enabled: true
    include:
    - vm-guest-memory
    - vm-cpu-delay
    - vm-disk-latency
    - vm-filesystem-used
    - virtualization-scrape
  slo:
    availabilityTarget: 99.9
telemetry:
  remoteWrite:
    username: apikey
    caSecret: ''
    caKey: ca.crt
    forcePrometheusProtocol: true
  scrapeInterval: 30s
  scrapeTimeout: 10s
  safety:
    profile: conservative
    metricAllowlist:
      enabled: true
      nodeRegex: (node_cpu_seconds_total|node_filesystem_avail_bytes|node_filesystem_files|node_filesystem_files_free|node_filesystem_free_bytes|node_filesystem_size_bytes|node_memory_MemAvailable_bytes|node_memory_MemTotal_bytes|node_network_receive_errs_total|node_network_transmit_errs_total|node_pressure_io_waiting_seconds_total|node_pressure_memory_waiting_seconds_total|node_scrape_collector_success|node_disk_(reads_completed_total|writes_completed_total|read_time_seconds_total|write_time_seconds_total|io_time_weighted_seconds_total|io_now)|node_vmstat_(pgmajfault|pswpin|pswpout))
      etcdRegex: (etcd_disk_backend_commit_duration_seconds_bucket|etcd_disk_backend_commit_duration_seconds_count|etcd_disk_backend_commit_duration_seconds_sum|etcd_disk_wal_fsync_duration_seconds_bucket|etcd_disk_wal_fsync_duration_seconds_count|etcd_disk_wal_fsync_duration_seconds_sum|etcd_mvcc_db_total_size_in_bytes|etcd_network_peer_round_trip_time_seconds_bucket|etcd_network_peer_round_trip_time_seconds_count|etcd_network_peer_round_trip_time_seconds_sum|etcd_server_has_leader|etcd_server_leader_changes_seen_total|etcd_server_proposals_applied_total|etcd_server_proposals_committed_total|etcd_server_proposals_failed_total|etcd_server_proposals_pending|etcd_server_quota_backend_bytes|process_start_time_seconds)
      traefikRegex: (traefik_open_connections|traefik_service_request_duration_seconds_bucket|traefik_service_request_duration_seconds_count|traefik_service_request_duration_seconds_sum|traefik_service_requests_bytes_total|traefik_service_requests_total|traefik_service_responses_bytes_total|traefik_tls_certs_not_after)
    cardinality:
      mode: observe
      node:
        sampleLimit: 5000
        seriesLimit: 5000
        labelLimit: 40
      etcd:
        sampleLimit: 5000
        seriesLimit: 5000
        labelLimit: 40
      traefik:
        sampleLimit: 10000
        seriesLimit: 10000
        labelLimit: 50
  traefik:
    enabled: false
    namespace: kube-system
    selector:
      app.kubernetes.io/name: rke2-traefik
    port: 9100
    targetPort: metrics
    allowMetricsNetworkPolicy: false
    inventoryImage: python:3.12-alpine
    existingIsolationConfirmed: false
    inventoryResources:
      requests:
        cpu: 5m
        memory: 24Mi
        ephemeral-storage: 16Mi
      limits:
        cpu: 100m
        memory: 64Mi
        ephemeral-storage: 64Mi
  nodeExporter:
    enabled: true
    pressureEnabled: false
    image: quay.io/prometheus/node-exporter:v1.12.1
    port: 19100
    resources:
      requests:
        cpu: 10m
        memory: 24Mi
        ephemeral-storage: 16Mi
      limits:
        cpu: 100m
        memory: 96Mi
        ephemeral-storage: 64Mi
  etcd:
    enabled: false
    endpoint: http://127.0.0.1:2381/metrics
    nodeSelector:
      node-role.kubernetes.io/etcd: 'true'
  vmagent:
    image: registry.rancher.com/suse-observability/vmagent:1.144.0-so6
    nodePort: 18429
    etcdPort: 18430
    queueMaxDiskMiB: 1024
    selfMonitoring: true
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
        ephemeral-storage: 128Mi
      limits:
        cpu: 150m
        memory: 128Mi
        ephemeral-storage: 1536Mi
    memoryAllowedBytes: 64MiB
    maxScrapeSize: 16MiB
  imagePullSecrets: []
  nodeSelector:
    kubernetes.io/os: linux
  tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
  - key: node-role.kubernetes.io/master
    operator: Exists
    effect: NoSchedule
  - key: node-role.kubernetes.io/etcd
    operator: Exists
    effect: NoExecute
  tests:
    enabled: false
  podInventory:
    enabled: true
    image: python:3.12-alpine
    resources:
      requests:
        cpu: 5m
        memory: 48Mi
      limits:
        cpu: 100m
        memory: 192Mi
virtualization:
  otlp:
    caSecret: ''
    caKey: ca.crt
  image:
    repository: dp.apps.rancher.io/containers/opentelemetry-collector
    tag: 0.156.0-k8s-13.1
    digest: ''
    pullPolicy: IfNotPresent
  imagePullSecrets:
  - name: application-collection
  command: []
  kubevirt:
    namespace: harvester-system
    service: kubevirt-prometheus-metrics
    metricsPortName: metrics
    ca:
      existingConfigMap: kubevirt-metrics-ca
      key: ca-bundle
      revision: '1'
      autoSync: true
      sourceConfigMap: kubevirt-ca
      syncImage: python:3.12-alpine
    serverNames:
      virt-api: virt-api.harvester-system.svc
      virt-controller: virt-controller.harvester-system.svc
      virt-handler: virt-handler.harvester-system.svc
      virt-operator: kubevirt-operator-webhook.harvester-system.svc
  scrapeInterval: 30s
  scrapeTimeout: 10s
  safety:
    profile: conservative
    metricAllowlist:
      enabled: true
      regex: (kubevirt_vm_resource_limits|kubevirt_vm_resource_requests|kubevirt_vmi_cpu_usage_seconds_total|kubevirt_vmi_filesystem_capacity_bytes|kubevirt_vmi_filesystem_used_bytes|kubevirt_vmi_info|kubevirt_vmi_memory_available_bytes|kubevirt_vmi_memory_resident_bytes|kubevirt_vmi_memory_usable_bytes|kubevirt_vmi_vcpu_(delay_seconds_total|wait_seconds_total|seconds_total)|kubevirt_vmi_memory_(actual_balloon_bytes|unused_bytes|cached_bytes|pgmajfault_total|pgminfault_total|swap_in_traffic_bytes|swap_out_traffic_bytes)|kubevirt_vmi_storage_(iops_read_total|iops_write_total|read_times_seconds_total|write_times_seconds_total|read_traffic_bytes_total|write_traffic_bytes_total|flush_requests_total|flush_times_seconds_total))
    cardinality:
      mode: observe
      sampleLimit: 10000
      labelLimit: 60
  otel:
    memoryLimitMiB: 384
    spikeLimitMiB: 102
    queueSize: 128
    queueConsumers: 2
    batchSize: 1000
    batchMaxSize: 1000
    retryMaxElapsedTime: 5m
  resources:
    requests:
      cpu: 20m
      memory: 192Mi
      ephemeral-storage: 16Mi
    limits:
      cpu: 300m
      memory: 512Mi
      ephemeral-storage: 64Mi
  nodeSelector:
    kubernetes.io/os: linux
  tolerations: []
  selfMonitoring: true
  longhorn:
    enabled: true
    namespace: longhorn-system
    service: longhorn-backend
    portName: manager
    allowMetricsNetworkPolicy: false
    existingIsolationConfirmed: false
