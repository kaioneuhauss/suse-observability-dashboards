{{- if ne .Values.mode "content" }}
{{- $root := . }}
{{- $v := deepCopy .Values.virtualization }}
{{- $_ := set $v "clusterName" (required "clusterName: use the exact SUSE integration name" .Values.clusterName) }}
{{- $_ := set $v.otlp "endpoint" (required "observability.otlpEndpoint is required for VM telemetry" .Values.observability.otlpEndpoint) }}
{{- $_ := set $v.otlp "existingSecret" .Values.ingestion.existingSecret }}
{{- $_ := set $v.otlp "secretKey" .Values.ingestion.secretKey }}
{{- with (dict "Values" $v "Release" .Release "Chart" .Chart "Files" .Files "Capabilities" .Capabilities "Template" .Template) }}
{{- $ := . }}
{{- $name := .Release.Name -}}
{{- if and (eq .Values.safety.profile "conservative") (lt (int (trimSuffix "s" .Values.scrapeInterval)) 30) -}}{{ fail "Perfil conservative exige scrapeInterval >= 30s" }}{{- end -}}
{{- if gt (int (trimSuffix "s" .Values.scrapeTimeout)) (int (trimSuffix "s" .Values.scrapeInterval)) -}}{{ fail "scrapeTimeout deve ser <= scrapeInterval" }}{{- end -}}
{{- if lt (int .Values.otel.batchMaxSize) (int .Values.otel.batchSize) -}}{{ fail "batchMaxSize deve ser >= batchSize" }}{{- end -}}
{{- if ge (int .Values.otel.spikeLimitMiB) (int .Values.otel.memoryLimitMiB) -}}{{ fail "spikeLimitMiB deve ser menor que memoryLimitMiB" }}{{- end -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ printf "%s-%s" $name .Release.Namespace | trunc 63 | trimSuffix "-" }}
  namespace: {{ .Values.kubevirt.namespace }}
rules:
{{- if .Values.kubevirt.ca.autoSync }}
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [{{ .Values.kubevirt.ca.sourceConfigMap | quote }}]
    verbs: [get]
{{- end }}
  - apiGroups: [""]
    resources: [pods, services]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ printf "%s-%s" $name .Release.Namespace | trunc 63 | trimSuffix "-" }}
  namespace: {{ .Values.kubevirt.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ printf "%s-%s" $name .Release.Namespace | trunc 63 | trimSuffix "-" }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
data:
  sync_ca.py: |
{{ .Files.Get "files/sync_ca.py" | indent 4 }}
  config.yaml: |
{{ include "kubevirt.config" . | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: sre-kubevirt-telemetry
    app.kubernetes.io/instance: {{ $name }}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $name }}
      app.kubernetes.io/name: sre-kubevirt-telemetry
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ $name }}
        app.kubernetes.io/name: sre-kubevirt-telemetry
      annotations:
        checksum/config: {{ include "kubevirt.config" . | sha256sum | quote }}
        kubevirt-ca-revision: {{ .Values.kubevirt.ca.revision | quote }}
    spec:
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      nodeSelector:
{{ toYaml .Values.nodeSelector | indent 8 }}
      tolerations:
{{ toYaml .Values.tolerations | indent 8 }}
      imagePullSecrets:
{{ toYaml .Values.imagePullSecrets | indent 8 }}
{{- if .Values.kubevirt.ca.autoSync }}
      initContainers:
        - name: prepare-ca
          image: {{ .Values.kubevirt.ca.syncImage | quote }}
          command: [python3, -B, /conf/sync_ca.py, --once]
          env:
            - {name: SOURCE_NAMESPACE, value: {{ .Values.kubevirt.namespace | quote }}}
            - {name: SOURCE_CONFIGMAP, value: {{ .Values.kubevirt.ca.sourceConfigMap | quote }}}
          resources:
            requests: {cpu: 5m, memory: 24Mi}
            limits: {cpu: 100m, memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: config, mountPath: /conf, readOnly: true}
            - {name: ca, mountPath: /kubevirt-ca}
{{- end }}
      containers:
{{- if .Values.kubevirt.ca.autoSync }}
        - name: sync-ca
          image: {{ .Values.kubevirt.ca.syncImage | quote }}
          command: [python3, -B, /conf/sync_ca.py]
          env:
            - {name: SOURCE_NAMESPACE, value: {{ .Values.kubevirt.namespace | quote }}}
            - {name: SOURCE_CONFIGMAP, value: {{ .Values.kubevirt.ca.sourceConfigMap | quote }}}
          resources:
            requests: {cpu: 5m, memory: 24Mi}
            limits: {cpu: 100m, memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: config, mountPath: /conf, readOnly: true}
            - {name: ca, mountPath: /kubevirt-ca}
{{- end }}
        - name: collector
          image: {{ if .Values.image.digest }}{{ printf "%s@%s" .Values.image.repository .Values.image.digest | quote }}{{ else }}{{ printf "%s:%s" .Values.image.repository .Values.image.tag | quote }}{{ end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
{{- with .Values.command }}
          command:
{{ toYaml . | indent 12 }}
{{- end }}
          args: ["--config=/conf/config.yaml"]
          env:
            - name: SUSE_INGEST_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.otlp.existingSecret }}
                  key: {{ .Values.otlp.secretKey }}
            - name: POD_IP
              valueFrom: {fieldRef: {fieldPath: status.podIP}}
          ports:
            - {name: health, containerPort: 13133}
          readinessProbe:
            httpGet: {path: /, port: health}
            periodSeconds: 15
          livenessProbe:
            httpGet: {path: /, port: health}
            initialDelaySeconds: 20
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
{{ toYaml .Values.resources | indent 12 }}
          volumeMounts:
            - {name: config, mountPath: /conf, readOnly: true}
            - {name: ca, mountPath: /kubevirt-ca, readOnly: true}
{{- if .Values.otlp.caSecret }}
            - {name: otlp-ca, mountPath: /otlp-ca, readOnly: true}
{{- end }}
      volumes:
        - name: config
          configMap: {name: {{ $name }}}
        - name: ca
{{- if .Values.kubevirt.ca.autoSync }}
          emptyDir: {sizeLimit: 1Mi}
{{- else }}
          configMap:
            name: {{ .Values.kubevirt.ca.existingConfigMap }}
            items:
              - {key: {{ .Values.kubevirt.ca.key }}, path: ca-bundle}
{{- end }}
{{- if .Values.otlp.caSecret }}
        - name: otlp-ca
          secret:
            secretName: {{ .Values.otlp.caSecret }}
            items:
              - {key: {{ .Values.otlp.caKey }}, path: ca.crt}
{{- end }}

{{- end }}
{{- end }}
