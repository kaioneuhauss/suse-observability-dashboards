apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-definitions
data:
  apply_monitors.py: |
{{ .Files.Get "files/apply_monitors.py" | indent 4 }}
  catalog.json: |
{{ .Files.Get "files/catalog.json" | indent 4 }}
{{- range $path, $_ := .Files.Glob "monitors/*.sty" }}
  {{ base $path }}: |
{{ $.Files.Get $path | indent 4 }}
{{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-apply
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, fsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: apply
          image: {{ .Values.runner.image | quote }}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          command: [/bin/sh, -c]
          args:
            - |
              set -eu
              wget -qO /work/sts.tgz {{ .Values.runner.downloadUrl | quote }}
              tar -xzf /work/sts.tgz -C /work
              exec python3 /definitions/apply_monitors.py
          env:
            - {name: STS_CLI_URL, value: {{ required "observability.url is required" .Values.observability.url | quote }}}
            - name: STS_CLI_SERVICE_TOKEN
              valueFrom:
                secretKeyRef: {name: {{ .Values.auth.existingSecret | quote }}, key: {{ .Values.auth.serviceTokenKey | quote }}}
            - {name: HOME, value: /work}
          volumeMounts:
            - {name: definitions, mountPath: /definitions, readOnly: true}
            - {name: work, mountPath: /work}
            {{- if .Values.runner.caSecret }}
            - {name: ca, mountPath: /ca, readOnly: true}
            {{- end }}
      volumes:
        - name: definitions
          configMap: {name: {{ .Release.Name }}-definitions}
        - name: work
          emptyDir: {sizeLimit: 96Mi}
        {{- if .Values.runner.caSecret }}
        - name: ca
          secret:
            secretName: {{ .Values.runner.caSecret }}
            items: [{key: {{ .Values.runner.caKey }}, path: ca.crt}]
        {{- end }}
