# Documentation only; three bundles and five deployment profiles.
- path: charts/sre-platform-telemetry
  chart: sre-platform-telemetry
  release: sre-platform-telemetry
  namespace: suse-observability
  integrationName: harvester
  values: charts/sre-platform-telemetry/config/harvester.yaml
- path: charts/sre-platform-telemetry
  chart: sre-platform-telemetry
  release: sre-platform-telemetry
  namespace: suse-observability-agent
  integrationName: observability-cluster
  values: charts/sre-platform-telemetry/config/observability-cluster.yaml
- path: charts/sre-platform-telemetry
  chart: sre-platform-telemetry
  release: sre-platform-telemetry
  namespace: suse-observability
  integrationName: rancher-kaio
  values: charts/sre-platform-telemetry/config/rancher-kaio.yaml
- path: charts/sre-kubevirt-telemetry
  chart: sre-kubevirt-telemetry
  release: kubevirt-otel-collector
  namespace: suse-observability
  integrationName: harvester
  values: charts/sre-kubevirt-telemetry/config/values.yaml
- path: charts/suse-observability-content
  chart: suse-observability-content
  release: suse-observability-content
  namespace: suse-observability
  integrationName: observability-cluster
  values: charts/suse-observability-content/config/values.yaml
