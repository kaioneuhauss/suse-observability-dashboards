# Mesclar nos values MANTIDOS do servidor SUSE; nao substituir a release inteira.
# Ajuste o hostname, serviceName se a release difere, e o Secret TLS do servidor.
opentelemetry-collector:
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
    hosts:
    - host: otlp-observability.example.com
      paths:
      - path: /
        pathType: Prefix
        serviceName: suse-observability-otel-collector-grpc
        port: 4317
    tls:
    - hosts:
      - otlp-observability.example.com
      secretName: PREENCHA-SECRET-TLS-OTLP
