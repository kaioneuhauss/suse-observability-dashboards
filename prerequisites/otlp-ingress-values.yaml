# Merge into the existing SUSE server values; do not replace the full configuration.
# Adjust the hostname, backend Service and TLS Secret for your server.
opentelemetry-collector:
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
    hosts:
    - host: otlp-observability.example.com
      paths:
      - path: /
        pathType: Prefix
        serviceName: suse-observability-otel-collector-grpc
        port: 4317
    tls:
    - hosts:
      - otlp-observability.example.com
      secretName: otlp-tls
